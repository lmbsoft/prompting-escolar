      return <div>
        <SectionTitle title="NotebookLM" subtitle="Una base documental para coberturas, entrevistas, documentos, audios transcriptos y archivo propio." />
        <div className="grid lg:grid-cols-4 md:grid-cols-2 gap-4">{notebookExercises.map(ex => <article key={ex.title} className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm"><h3 className="font-bold text-slate-900">{ex.title}</h3><ol className="list-decimal ml-5 mt-3 text-sm space-y-1">{ex.steps.map(s => <li key={s}>{s}</li>)}</ol></article>)}</div>
        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-5 mt-6"><h3 className="font-bold text-amber-900">Regla de uso</h3><p>Si un dato va al aire, abrí la cita o el documento original. NotebookLM ayuda a encontrar y resumir, pero la verificación final sigue siendo editorial.</p></div>
      </div>;
    }

    function App() {
      const [view, setView] = useState('theory');
      const content = {
        theory: <TheorySection />, gym: <GymSection />, research: <ResearchSection />, audio: <AudioVideoSection />, automation: <AutomationSection />, images: <ImagesSection />, sheets: <SheetsSection />, challenges: <ChallengesSection />, stories: <StoriesSection />, notebook: <NotebookSection />
      }[view];
      return <div>
        <header className="sticky top-0 z-10 bg-white/95 backdrop-blur border-b border-slate-200">
          <div className="max-w-6xl mx-auto px-4 py-4">
            <div className="mb-3"><h1 className="text-2xl font-extrabold text-slate-900">Laboratorio de IA para producción radial regional</h1><p className="text-slate-500">Noticias, audio, investigación, automatizaciones y piezas multimedia</p></div>
            <nav className="flex gap-2 overflow-x-auto pb-1">{tabs.map(([id,label]) => <button key={id} onClick={() => setView(id)} className={`px-4 py-2 whitespace-nowrap text-sm font-bold ${view===id?'bg-teal-700 text-white shadow':'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>{label}</button>)}</nav>
          </div>
        </header>
        <main className="max-w-6xl mx-auto px-4 py-8">{content}</main>
        <footer className="border-t border-slate-200 bg-white mt-10"><div className="max-w-6xl mx-auto px-4 py-6 text-center text-slate-500 text-sm">Material formativo adaptado para producción radial regional. Usar IA como asistente, siempre con revisión editorial.</div></footer>
      </div>;
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

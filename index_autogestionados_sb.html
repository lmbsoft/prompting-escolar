                    'Una IA generativa no piensa como una persona ni "sabe" cosas como las sabe un técnico con años de oficio. Funciona prediciendo, a gran velocidad, qué texto (o qué imagen) es el más probable a partir de patrones que aprendió de enormes volúmenes de información. Cuando le escribís un pedido, calcula la respuesta más plausible. Su fortaleza es combinar ideas, redactar y ordenar; su debilidad es la certeza de cada dato concreto.',
                    'Pensala como un asistente nuevo, muy rápido y muy leído, pero que recién entra al taller: puede redactarte la respuesta a un cliente, armarte una planilla para seguir los trabajos o proponerte el texto de una promoción en segundos, pero no conoce TU realidad hasta que se la contás. Cuanto mejor le expliques el contexto —a qué se dedica el negocio, qué equipo o falla tenés entre manos, para quién es lo que estás preparando—, mejores y más útiles serán sus respuestas.',
                    'Toda la conversación que tenés con la IA forma su "memoria de trabajo" del momento: lee todo lo que escribiste desde el primer mensaje para responder el último. Por eso conviene escribir ordenado y dar contexto: le estás dando mejor materia prima. Si arrancás con un pedido vago, te responde algo genérico; si le das objetivo, contexto y formato, el resultado sube de nivel notablemente.',
                    'Hoy hay varias IA conversacionales importantes: ChatGPT, Claude, Gemini, Copilot y otras. Cada una tiene puntos fuertes distintos: algunas redactan mejor, otras analizan documentos largos (un manual, una hoja de datos, un instructivo), otras generan o editan imágenes. No existe "la mejor" en abstracto; existe la más adecuada para cada tarea. Lo importante es probar con tu propio trabajo: es gratis equivocarse con la IA.',
                    'La regla práctica más importante: no la trates como una autoridad final, tratala como un asistente. Vos seguís siendo quien decide. La IA te acerca borradores, estructuras y opciones; vos ponés el criterio de quien conoce el oficio, el negocio y a los clientes. Esa combinación —tu experiencia técnica + la velocidad de la IA— es lo que la vuelve una herramienta poderosa.',

objective: `Documentar un proceso clave para estandarizarlo.`, prompt: `Actuá como responsable de control de calidad. Ayudame a redactar un protocolo de control de un trabajo para que cualquiera lo siga igual: qué se controla al cerrar cada etapa (relevamiento, cableado, montaje, pruebas), registro fotográfico y criterios para dar por aprobado. Dejá [completar] donde van mis valores y responsables.`, why: `Estandariza la calidad y facilita explicarle el trabajo al cliente.` },
{ id: 'p33', level: 'profundizar', domain: `Organización del negocio`, title: `Rutina semanal de gestión`,
objective: `Que la gestión no se acumule.`, prompt: `Ayudame a diseñar una rutina semanal de gestión para mi negocio, de 30 minutos por día: qué revisar cada día (trabajos en curso, ventas y consultas, stock y compras, redes, planificación). Formato de tabla por día con la tarea y su objetivo. Que sea realista para alguien que también está mucho con las manos en los equipos.`, why: `Convierte la gestión en un hábito liviano y constante.` },

// ─── NIVEL PROYECTAR ───
{ id: 'p34', level: 'proyectar', domain: `Plan de negocio`, title: `Plan de comercialización del taller`,
objective: `Diseñar la estrategia comercial completa del negocio.`, prompt: `Actuá como consultor de negocios. Ayudame a diseñar el plan comercial del taller por fases: 1) diagnóstico (servicios, público, qué me diferencia), 2) objetivos de venta, 3) precios y promos, 4) difusión y canales, 5) seguimiento. Para cada fase: acciones, entregables y un indicador para saber si voy bien.`, why: `Te da una hoja de ruta integral, no acciones sueltas.` },
{ id: 'p35', level: 'proyectar', domain: `Imágenes para difusión`, title: `Identidad visual del negocio`,
objective: `Definir el estilo gráfico de todo el material.`, prompt: `Actuá como director de arte y diseñador de marca. Ayudame a definir, por fases, la identidad visual de mi negocio de audio y electrónica: 1) valores y personalidad, 2) paleta de colores y tipo de fotos, 3) cómo se vería un logo simple, 4) cómo aplicarla en el cartel del local, folletos y redes. Para cada fase dame opciones y un prompt de imagen para explorarla.`, why: `Unifica todo tu material bajo una imagen coherente y memorable.` },
{ id: 'p36', level: 'proyectar', domain: `Plan de negocio`, title: `Plan para sumar un servicio nuevo`,
objective: `Lanzar algo nuevo con orden.`, prompt: `Actuá como consultor de negocios. Quiero sumar un servicio o una línea nueva (por ejemplo, alarmas, cámaras, polarizados o venta online). Diseñá un plan por fases: qué necesito (conocimiento, equipos, proveedores), cómo conseguir los primeros clientes, qué riesgos cuidar y un primer paso muy concreto y barato para este mes.`, why: `Convierte una idea grande en pasos manejables y accionables.` },
{ id: 'p37', level: 'proyectar', domain: `Planilla de cálculo`, title: `Tablero de control del negocio`,
objective: `Tener todos los indicadores en una vista.`, prompt: `Ayudame a diseñar, por etapas, un tablero de control (dashboard) simple en planilla para mi taller: trabajos del mes, ventas por tipo de servicio, stock crítico, costos vs. lo previsto y caja. Indicame qué hojas y tablas dinámicas necesito, cómo conectar los datos y cómo armar 3 o 4 gráficos clave. Empezá por la estructura y avanzá paso a paso.`, why: `Te da una sala de comando para decidir con datos de un vistazo.` },
{ id: 'p38', level: 'proyectar', domain: `Pensamiento estratégico`, title: `Escenarios para el próximo año del negocio`,
objective: `Anticipar y prepararte para distintos futuros.`, prompt: `Actuá como analista de escenarios. Ayudame a proyectar tres escenarios para el próximo año del negocio (optimista, realista, adverso) según variables como el costo de los equipos, la demanda y la competencia. Para cada escenario: qué supone, qué oportunidad y qué riesgo trae, y qué prepararía desde ahora. Cerrá con decisiones que sirven en los tres casos.`, why: `Te prepara para lo que venga en vez de reaccionar tarde.` },
{ id: 'p39', level: 'proyectar', domain: `Plan de negocio`, title: `Evaluar una oportunidad nueva con criterio`,
objective: `Analizar una oportunidad con criterio.`, prompt: `Actuá como consultor de negocios. Ayudame a evaluar, por fases, una oportunidad nueva (un local más grande, una sucursal, una alianza con una concesionaria). Para cada fase: qué averiguar (demanda, costos, competencia, riesgos), qué números estimar y qué cuidar. Priorizá los pasos según costo e información disponible. No inventes datos: marcá qué verificar.`, why: `Te ordena una decisión grande antes de comprometer plata.` },
{ id: 'p40', level: 'proyectar', domain: `Organización del negocio`, title: `Sistema personal de trabajo con IA`,
objective: `Integrar la IA a tu rutina de forma estable.`, prompt: `Ayudame a diseñar mi sistema personal para trabajar con IA en el negocio: qué tareas le delego (textos de venta, planillas, imágenes de producto, búsqueda y diagnóstico, organización), qué prompts guardo como plantillas, cuándo verifico y cómo mido si me está ahorrando tiempo. Entregalo por fases, con un set inicial de 5 plantillas de prompt para mis tareas más frecuentes.`, why: `Hace que la IA se vuelva parte estable de tu forma de trabajar.` },

// ─── NIVEL INICIO (continuación) ───
{ id: 'p41', level: 'inicio', domain: `Guías para clientes`, title: `Guía simple para elegir un buen equipo`,
objective: `Dar valor a tus clientes con contenido útil.`, prompt: `Actuá como técnico que orienta al cliente. Armame una guía simple de 6 puntos para alguien que quiere mejorar el audio de su auto (qué mirar, qué preguntar, cómo no gastar de más, qué diferencia un buen trabajo de uno apurado). Tono claro y honesto, sin presionar a comprar. Para compartir como contenido de valor.`, why: `El contenido útil acerca clientes y posiciona tu seriedad.` },
{ id: 'p42', level: 'inicio', domain: `Eventos y muestras`, title: `Checklist para una jornada de promoción o feria`,
objective: `No olvidarte nada el día del evento.`, prompt: `Actuá como organizador de eventos comerciales. Armame una checklist para una jornada de promoción en el local o una feria del rubro: cartelería, material impreso, equipos para mostrar, una demo de sonido, registro de interesados y seguimiento. Formato de lista verificable por bloques (antes, durante, después).`, why: `Llegás al evento preparado y das una imagen profesional.` },
{ id: 'p43', level: 'inicio', domain: `Gestión del tiempo`, title: `Organizar la semana entre taller, venta y vida`,
objective: `Equilibrar el trabajo y el tiempo personal.`, prompt: `Actuá como asesor de productividad. Ayudame a organizar una semana tipo que combine trabajos en el taller, atención a clientes, gestión (planilla, llamados, compras) y mi tiempo personal (familia, descanso, algún viaje). Dame una grilla por día con bloques de tiempo realistas para alguien con muchos frentes abiertos que no quiere vivir pegado al trabajo.`, why: `Evita que la gestión se coma el tiempo personal.` },
{ id: 'p44', level: 'inicio', domain: `Cartelería y señalética`, title: `Qué información debe llevar el cartel del local`,
objective: `Armar un cartel claro y que capte.`, prompt: `Actuá como diseñador de cartelería. Decime qué información debería incluir el cartel del local o la vidriera (nombre del negocio, servicios principales, una frase gancho, contacto/WhatsApp, redes, horarios) y cómo jerarquizarla para que se lea desde lejos. Marcá qué datos conviene verificar antes de imprimir.`, why: `Un cartel claro y completo transmite seriedad y capta consultas.` },
{ id: 'p45', level: 'inicio', domain: `Atención al cliente`, title: `Mensaje de posventa y agradecimiento`,
objective: `Cuidar el vínculo después del trabajo.`, prompt: `Redactá un mensaje breve y cálido para enviarle a un cliente después de entregarle el trabajo: agradecimiento, recordatorio de un dato útil (garantía, cuidados, contacto) y disponibilidad para lo que necesite. Dame dos versiones, una más corta y una un poco más completa.`, why: `El cuidado posventa convierte un cliente en alguien que te recomienda.` },
{ id: 'p46', level: 'inicio', domain: `Redes sociales`, title: `Pie de foto para una publicación`,
objective: `Acompañar una imagen con buen texto.`, prompt: `Escribime tres opciones de pie de foto para una publicación con la imagen de un trabajo terminado. Tono cercano y confiable, con un emoji o dos como mucho, una frase que cuente algo del trabajo o un beneficio para el cliente y un cierre que invite a consultar. Máximo 3 líneas cada uno.`, why: `Una buena imagen rinde más con un texto que conecte.` },
{ id: 'p47', level: 'inicio', domain: `Marketing y difusión`, title: `Promoción para impulsar ventas`,
objective: `Aprovechar un momento para acelerar la venta.`, prompt: `Proponme 3 ideas de promoción para un servicio o equipo (por ejemplo: combo con descuento, instalación bonificada, garantía extendida). Para cada una: en qué consiste, a qué cliente apunta y un texto breve para anunciarla. Que sean realistas y honestas. No inventes números.`, why: `Una acción comercial concreta puede mover las ventas.` },
{ id: 'p48', level: 'inicio', domain: `Planilla de cálculo`, title: `Calcular precios con un margen parejo`,
objective: `Fijar precios de servicios y equipos sin errores.`, prompt: `Tengo el costo de cada equipo o servicio y quiero fijar el precio con un margen parejo. Dame la fórmula para hacerlo en una planilla y armá una tablita de ejemplo con [completar] en los valores. Mostrame también cómo aplicar un margen distinto según el tipo de trabajo. Google Sheets.`, why: `Evita errores al fijar el precio de cada trabajo.` },
{ id: 'p49', level: 'inicio', domain: `Dispositivos digitales`, title: `Organizar las fotos de los trabajos`,
objective: `Encontrar tus fotos cuando las necesitás.`, prompt: `Actuá como instructor digital paciente. Enseñame paso a paso a organizar las fotos de los trabajos en álbumes en el celular (por cliente o por tipo de trabajo, con antes y después) y a encontrarlas rápido después. Dame los pasos para [Android / iPhone] y un criterio simple para nombrar los álbumes.`, why: `Tener las fotos ordenadas te ahorra tiempo y respalda tu trabajo.` },
{ id: 'p50', level: 'inicio', domain: `Relación con clientes`, title: `Lista de clientes e interesados`,
objective: `Empezar a cuidar a quienes te compran y consultan.`, prompt: `Ayudame a armar una lista simple de clientes e interesados en una planilla: qué columnas conviene tener para recordar quién es cada uno, qué le interesa o qué trabajo le hiciste, en qué estado está la conversación, sin guardar datos sensibles de más. Después decime una idea concreta para hacer seguimiento sin ser invasivo.`, why: `Una cartera ordenada de clientes vale tanto como una buena promo.` },

// ─── NIVEL PROFUNDIZAR (continuación) ───
{ id: 'p51', level: 'profundizar', domain: `Guías para clientes`, title: `Mini guía técnica como gancho`,
objective: `Crear un material de valor que atraiga clientes.`, prompt: `Actuá como redactor de contenidos técnicos. Ayudame a armar una mini guía útil (digital o impresa) para tus clientes, por ejemplo "cómo elegir parlantes para tu auto" o "señales de que tu equipo necesita service": qué mirar, errores comunes, consejos prácticos. Tono honesto y útil. Sugerí cómo presentarla con tu marca.`, why: `Una guía propia te posiciona como experto y atrae clientes de calidad.` },
{ id: 'p52', level: 'profundizar', domain: `Eventos y muestras`, title: `Plan para participar de una feria del rubro`,
objective: `Sacar el máximo provecho de un evento del rubro.`, prompt: `Actuá como organizador de presencia en ferias. Ayudame a planificar la participación en una feria del rubro (autos, sonido, electrónica): objetivos (vender, contactos, marca), qué llevar (equipos para mostrar, demos, lista de precios, tarjetas), cómo presentar el stand, cómo captar datos de interesados y qué hacer después del evento. Dame un plan por etapas (antes, durante, después).`, why: `Una feria bien aprovechada deja trabajos y contactos para meses.` },
{ id: 'p53', level: 'profundizar', domain: `Capacitación del equipo`, title: `Guía para que un ayudante atienda como vos`,
objective: `Poder delegar la atención sin perder calidad.`, prompt: `Actuá como formador de equipos. Ayudame a escribir una guía breve para que un ayudante pueda atender a mis clientes igual que yo: cómo recibir, información de los servicios y precios, formas de pago, qué preguntar para entender qué necesita el cliente, y qué hacer ante dudas o reclamos. Formato claro, con [completar] en los datos del negocio.`, why: `Te permite delegar la atención y crecer sin perder el trato.` },
{ id: 'p54', level: 'profundizar', domain: `Cartelería y señalética`, title: `Comparar formas de presentar tus servicios`,
objective: `Decidir cómo presentar el negocio para más valor.`, prompt: `Actuá como diseñador de comunicación. Ayudame a comparar 3 formas de presentar mis servicios con más valor percibido (folleto simple, catálogo con fotos de productos y trabajos, una página web simple). Para cada una: costo aproximado, percepción del cliente, para qué sirve y esfuerzo. Cerrá con una recomendación según mi momento.`, why: `La presentación influye directo en el tipo de cliente que atraés.` },
{ id: 'p55', level: 'profundizar', domain: `Finanzas y costos`, title: `Rentabilidad por canal de venta`,
objective: `Saber qué canal te deja más resultado.`, prompt: `Ayudame a comparar la rentabilidad de mis canales de venta (local y boca a boca, redes, portales o marketplaces, alianzas con talleres o concesionarias). Decime qué datos necesito de cada canal (trabajos, costo asociado, comisión) y cómo armar una planilla que muestre el resultado real de cada uno. No inventes cifras: guiame para cargarlas.`, why: `Te dice dónde conviene poner la energía y el presupuesto comercial.` },
{ id: 'p56', level: 'profundizar', domain: `Planilla de cálculo`, title: `Control de gastos vs. presupuesto con alertas`,
objective: `Saber cuándo un gasto se está pasando.`, prompt: `Ayudame a armar en una planilla un control que compare lo gastado por rubro (repuestos, sueldos, servicios, impuestos) contra lo presupuestado y me avise cuando un rubro supera un umbral. Indicame las columnas, la fórmula con SI para marcar "desvío" y cómo usar formato condicional para que se pinte en rojo. Google Sheets.`, why: `Detectás los desvíos a tiempo, no cuando ya es tarde.` },
{ id: 'p57', level: 'profundizar', domain: `Comercialización`, title: `Propuesta para un aliado comercial`,
objective: `Abrir un canal de venta con un aliado.`, prompt: `Actuá como asesor comercial. Ayudame a preparar una propuesta para sumar un aliado (un taller mecánico, una concesionaria, un lavadero) que te derive clientes: qué ofrecés, material que les vas a dar, condiciones y comisión, y reglas claras de trabajo. Incluí un cierre que proponga empezar con una prueba. Dejá [completar] en lo numérico.`, why: `Un buen aliado amplía mucho tu alcance de clientes.` },
{ id: 'p58', level: 'profundizar', domain: `Marketing y difusión`, title: `Encuesta corta para entender al cliente`,
objective: `Escuchar a tus clientes con método.`, prompt: `Ayudame a diseñar una encuesta breve (máximo 6 preguntas) para clientes que pasaron por el taller: qué buscan, qué valoran (precio, calidad, rapidez, garantía), qué los frena. Mezclá preguntas de opción y una abierta. Dame también un mensaje corto y amable para invitarlos a responderla.`, why: `Las mejoras de tu propuesta salen de entender qué frena la decisión.` },
{ id: 'p59', level: 'profundizar', domain: `Comunicar calidad`, title: `Comunicar la calidad de tu trabajo con honestidad`,
objective: `Mostrar la calidad de tu trabajo sin exagerar.`, prompt: `Actuá como asesor de comunicación técnica. Ayudame a comunicar las características reales de mis trabajos (calidad de los componentes, prolijidad del cableado, garantía, pruebas que hago antes de entregar) sin caer en exageraciones ni promesas falsas. Pedime primero qué incluyo y después ayudame a redactar 3 mensajes honestos y concretos.`, why: `La calidad bien comunicada suma valor; mal comunicada, resta credibilidad.` },
{ id: 'p60', level: 'profundizar', domain: `Atención al cliente`, title: `Protocolo de respuesta en 24 horas`,
objective: `Que ninguna consulta de un cliente quede sin responder.`, prompt: `Ayudame a definir un protocolo simple para responder consultas de clientes en menos de 24 horas: cómo registrar las consultas que entran (web, redes, WhatsApp, teléfono), mensajes tipo para los casos más comunes y qué hacer cuando no puedo resolver al instante. Formato de mini procedimiento.`, why: `La rapidez de respuesta muchas veces define quién se queda con el trabajo.` },

// ─── NIVEL PROYECTAR (continuación) ───
{ id: 'p61', level: 'proyectar', domain: `Plan de negocio`, title: `Plan de marca para tu negocio`,
objective: `Dar coherencia a toda tu comunicación.`, prompt: `Actuá como consultor de marca. Ayudame a armar, por fases, un plan de marca para mi negocio de audio y electrónica: identidad y mensaje central, calendario de momentos clave (promos, novedades, temporada), líneas de contenido y objetivos por trimestre. Para cada fase: acciones, entregables y un indicador de avance.`, why: `Te da una hoja de ruta de marca en vez de acciones improvisadas.` },
{ id: 'p62', level: 'proyectar', domain: `Plan de negocio`, title: `Apuntar a un segmento nuevo de clientes`,
objective: `Sumar un segmento que compra más (flotas, empresas).`, prompt: `Actuá como consultor de negocios. Quiero atraer un segmento nuevo (por ejemplo, flotas de autos, remiserías o empresas con varios vehículos). Diseñá un plan por fases: qué necesito (propuesta, material, condiciones por volumen), cómo llegar a ese público, qué riesgos cuidar y un primer paso concreto y barato para probar el canal. Dejá [completar] en lo numérico.`, why: `Convierte la ambición de crecer en pasos manejables.` },
{ id: 'p63', level: 'proyectar', domain: `Pensamiento estratégico`, title: `Diversificación de tu oferta`,
objective: `Explorar nuevas líneas de negocio.`, prompt: `Actuá como analista estratégico. Ayudame a evaluar opciones para diversificar mi negocio (alarmas, cámaras, polarizados, venta online de accesorios, service a domicilio). Para cada una: demanda potencial, esfuerzo, inversión y riesgo. Ordenalas en una matriz esfuerzo/impacto y recomendá por dónde empezar.`, why: `Diversificar bien reduce tu dependencia de un solo tipo de trabajo.` },
{ id: 'p64', level: 'proyectar', domain: `Plan de negocio`, title: `Sistema de venta y posventa`,
objective: `Ordenar el flujo completo de un trabajo.`, prompt: `Actuá como consultor de negocios. Ayudame a diseñar, por fases, un sistema simple para gestionar un trabajo de punta a punta: consulta, presupuesto, turno, trabajo, entrega y posventa/garantía. Indicá qué parte conviene llevar en planilla y dame un primer paso para implementarlo este mes.`, why: `Un flujo ordenado evita olvidos, demoras y clientes molestos.` },
{ id: 'p65', level: 'proyectar', domain: `Relación con la comunidad`, title: `Vínculo con el barrio y la comunidad`,
objective: `Generar buena imagen local.`, prompt: `Actuá como gestor de vínculos con la comunidad. Ayudame a diseñar, por fases, cómo cuidar la relación con el barrio y los vecinos del local (comunicación, no molestar con ruido o autos en la vereda, limpieza, una buena imagen del negocio). Incluí objetivos, acciones simples y un primer paso.`, why: `Un negocio que cuida el entorno suma reputación y evita conflictos.` },
{ id: 'p66', level: 'proyectar', domain: `Organización del negocio`, title: `Manual de procesos del negocio`,
objective: `Poner por escrito cómo funciona tu actividad.`, prompt: `Ayudame a armar, por fases, un manual de procesos simple de mi negocio de audio y electrónica: compras y stock, taller (trabajos), comercialización, atención y administración. Para cada proceso: pasos, responsable y registros. Empecemos por listar los procesos y después desarrollamos uno por vez.`, why: `Un negocio documentado es más fácil de delegar, mejorar y sostener.` },
{ id: 'p67', level: 'proyectar', domain: `Plan de negocio`, title: `Campaña para reactivar ventas en temporada baja`,
objective: `Mover el negocio cuando baja la demanda.`, prompt: `Actuá como consultor de marketing. Ayudame a diseñar, por fases, una campaña para reactivar ventas en una temporada floja: a qué cliente apuntar, qué destacar (promo, garantía, financiación), propuesta y difusión. Incluí un cronograma con cuándo empezar cada cosa.`, why: `Una campaña a tiempo evita que los meses flojos te coman la caja.` },
{ id: 'p68', level: 'proyectar', domain: `Pensamiento estratégico`, title: `Análisis FODA del negocio`,
objective: `Mirar el negocio con perspectiva para decidir.`, prompt: `Actuá como analista estratégico. Guiame para armar un análisis FODA (Fortalezas, Oportunidades, Debilidades, Amenazas) de mi negocio de audio para autos y reparación de electrónica. Haceme preguntas por cada cuadrante para que yo aporte mi realidad, y al final ayudame a sacar 3 decisiones concretas que surjan del análisis.`, why: `Te ordena la mirada del negocio y la convierte en decisiones.` },

// ─── NUEVOS PROMPTS: FUENTES, CRITERIO Y MULTIMEDIA ───
{ id: 'p69', level: 'inicio', domain: `Búsqueda y fuentes`, title: `Buscar un dato técnico o información actualizada`,
objective: `No usar información vieja o dudosa en decisiones sensibles.`, prompt: `Necesito información actualizada sobre [tema: la hoja de datos de un equipo, una norma de instalación, valores de referencia de un servicio]. Buscá fuentes confiables y, si es posible, oficiales o del fabricante. Para cada dato importante indicá: fuente, fecha, qué tan confiable parece y qué debería verificar yo (midiendo o probando) antes de usarlo. No uses foros como evidencia principal.`, why: `Te entrena a pedir fuentes, fechas y verificación antes de actuar.` },
{ id: 'p70', level: 'inicio', domain: `Evaluación estratégica`, title: `Que la IA no te dé la razón de más`,
objective: `Evaluar una idea con mirada crítica antes de entusiasmarte.`, prompt: `Tengo esta idea para mi negocio: [describir idea]. No quiero que me des la razón por compromiso. Evaluála como asesor exigente: puntos fuertes, riesgos, supuestos débiles, datos que faltan y una prueba chica de bajo costo para este mes.`, why: `Evita la complacencia y convierte el entusiasmo en una prueba concreta.` },
{ id: 'p71', level: 'inicio', domain: `Producción multimedia`, title: `Guion corto para un reel de un trabajo`,
objective: `Transformar una idea visual en una pieza simple para redes.`, prompt: `Actuá como guionista de videos cortos. Diseñá un reel de 20 segundos para mostrar un trabajo o un servicio del taller. Dame: idea central, 5 planos (el problema, el equipo, la instalación, el resultado, cierre), texto sugerido en pantalla (mínimo y revisable), voz en off opcional y cierre invitando a consultar por WhatsApp. Tono claro y honesto.`, why: `Te permite planificar antes de generar imágenes o grabar video.` },
{ id: 'p72', level: 'inicio', domain: `Imágenes para difusión`, title: `Imagen sin texto para cargar datos exactos después`,
objective: `Evitar errores de letras, precios o datos dentro de una imagen.`, prompt: `Generá una imagen de un producto o un trabajo para una publicación, sin ningún texto. Dejá un espacio limpio arriba para un título y otro abajo para precio o WhatsApp, que yo voy a agregar después. Estilo moderno, prolijo, con buena luz y fondo limpio. Aclará que es imagen ilustrativa.`, why: `La IA arma la escena, pero vos conservás el control de los datos exactos.` },
{ id: 'p73', level: 'profundizar', domain: `Investigación profunda`, title: `Investigar una oportunidad para el negocio`,
objective: `Tomar una decisión grande con fuentes, supuestos y riesgos claros.`, prompt: `Quiero hacer una investigación profunda para decidir si conviene [oportunidad: sumar un servicio nuevo / abrir venta online / apuntar a flotas]. Contexto: negocio de audio para autos y reparación de electrónica. Primero proponé un plan de investigación. Después analizá oportunidad, demanda, números, costos, riesgos, fuentes confiables, supuestos y primer experimento barato. Separá datos verificados, inferencias y preguntas pendientes.`, why: `Lleva una idea grande a un informe accionable sin saltar directo a invertir.` },
{ id: 'p74', level: 'profundizar', domain: `Evaluación estratégica`, title: `Rúbrica de 100 puntos para una decisión`,

const resolveBadPrompt = (item) => {
const domainKey = item.domain.toLowerCase();
if (weakPromptByDomain[domainKey]) return weakPromptByDomain[domainKey];
if (item.level === 'inicio') return `Necesito ayuda con ${item.domain.toLowerCase()} para
${item.objective.toLowerCase()}.`;
if (item.level === 'profundizar') return `Trabaja este tema: ${item.title}. Dame una versión útil para hoy.`;
return `Resuelve completo este proyecto: ${item.title}.`;
};

const resolveWhyBad = (item) => {
if (item.level === 'inicio') return `Es específico en tema, pero no define público, formato de salida ni criterios para
evaluar si la respuesta sirve.`;
if (item.level === 'profundizar') return `Pide una tarea exigente, pero no fija alcance, límites ni método de revisión.
La salida puede quedar correcta en apariencia y floja en calidad.`;
return `Intenta resolver un proyecto complejo de una sola vez, sin fases ni entregables intermedios. Eso aumenta errores
y reduce control de autoría.`;
};

const resolveQualityCriteria = (item) => {
const domain = item.domain.toLowerCase();
if (domain.includes('escritura') || domain.includes('editorial') || domain.includes('memorias') ||
domain.includes('legado') || domain.includes('guías') || domain.includes('guía')) return `coherencia argumental, voz propia, transiciones y cierre con sentido`;
if (domain.includes('docencia') || domain.includes('curso') || domain.includes('aprendizaje') ||
domain.includes('capacitación') || domain.includes('transferencia')) return `claridad didáctica, secuencia progresiva, actividad aplicable y evidencia de

if (domain.includes('investigación') || domain.includes('fuentes') || domain.includes('búsqueda') || domain.includes('ciencia')) return `trazabilidad
de fuentes, distinción entre verificado/pendiente y riesgos de error`;
if (domain.includes('multimedia') || domain.includes('video') || domain.includes('storyboard')) return `coherencia visual,
claridad del mensaje, control de textos exactos y factibilidad de producción`;
if (domain.includes('evaluación estratégica')) return `criterios explícitos, supuestos visibles, riesgos concretos y
primer experimento verificable`;
if (domain.includes('comunicación') || domain.includes('entrevista') || domain.includes('familiar')) return `tono
adecuado, intención explícita, reducción de ambigüedad y salida accionable`;
if (domain.includes('proyecto') || domain.includes('estratégico') || domain.includes('iniciativa') ||
domain.includes('impacto')) return `fases realistas, hitos verificables, riesgos y plan de mitigación`;
if (domain.includes('matemáticas') || domain.includes('lógica')) return `precisión del razonamiento, claridad de cada
paso y verificabilidad del resultado`;
if (domain.includes('seguridad') || domain.includes('trámites')) return `pasos verificables, canales oficiales
identificados y alertas de riesgo`;
if (domain.includes('precio') || domain.includes('finanzas') || domain.includes('costo') || domain.includes('planilla') || domain.includes('registro')) return `exactitud de los cálculos, claridad de las fórmulas y verificabilidad de cada número`;
if (domain.includes('imágen') || domain.includes('imagen') || domain.includes('marketing') || domain.includes('difusión') || domain.includes('redes') || domain.includes('cartelería')) return `claridad del estilo, coherencia de marca, honestidad del mensaje y formato listo para usar`;
if (domain.includes('obra') || domain.includes('cronograma') || domain.includes('control') || domain.includes('calidad') || domain.includes('sustentable')) return `pasos verificables, criterios de control claros y respeto del criterio profesional`;
if (domain.includes('cliente') || domain.includes('comprador') || domain.includes('comercial') || domain.includes('logística') || domain.includes('proveedor') || domain.includes('material') || domain.includes('evento') || domain.includes('entorno')) return `tono adecuado, propuesta accionable y reducción de ambigüedad`;
return `claridad, utilidad práctica, control de supuestos y siguiente paso concreto`;
};

const resolveToneFrame = (item, role, outputFormat, qualityCriteria, techniques) => {
if (item.level === 'inicio') {
return [
`Actúa como ${role} con tono cercano, claro y paciente.`,
``, `Meta de esta sesión: ${item.objective}`,
`Pedido base: ${item.prompt}`,
``, `Trabajemos paso a paso:`,
`- Si falta contexto, hazme primero 2 o 3 preguntas breves de calibración.`,
`- Evita tecnicismos innecesarios y usa ejemplos concretos.`,
`- Formato de salida solicitado: ${outputFormat}`,
`- Cierra con una mini revisión de calidad (criterios: ${qualityCriteria}).`,
``, `Antes de cerrar, sugiere una versión 2 de este pedido para mejorar precisión sin complejizar de más.`,
`Técnicas aplicadas: ${techniques.join(', ')}.`
];
}
if (item.level === 'profundizar') {
return [
`Actúa como ${role} con enfoque riguroso y criterio crítico.`,
``, `Objetivo de trabajo: ${item.objective}`,
`Consigna inicial: ${item.prompt}`,
``, `Condiciones metodológicas:`,
`1) Si hay ambigüedad, abre con preguntas de calibración antes de producir la versión final.`,
`2) Entrega una propuesta estructurada, con supuestos explícitos y justificación breve por bloque.`,
`3) Respeta este formato de salida: ${outputFormat}`,
`4) Incluye control de calidad al final con estos criterios: ${qualityCriteria}.`,
`5) Señala qué conviene iterar en una segunda ronda y por qué.`,
``, `Técnicas aplicadas en este prompt: ${techniques.join(', ')}.`
];
}
return [
`Actúa como ${role} con enfoque estratégico y orientación a ejecución.`,
``, `Resultado buscado: ${item.objective}`,
`Desafío base: ${item.prompt}`,
``, `Diseña la respuesta como un plan por fases:`,
`Fase 1 - Delimitación: supuestos, alcance y preguntas críticas de calibración.`,
`Fase 2 - Diseño: propuesta principal en formato solicitado (${outputFormat}).`,
`Fase 3 - Implementación: hitos, entregables y métricas de avance.`,
`Fase 4 - Control: riesgos, límites y revisión final con criterios (${qualityCriteria}).`,
``, `Cierre obligatorio: incluye una versión 2 del pedido para iterar con mayor precisión y menor riesgo.`,
`Técnicas aplicadas: ${techniques.join(', ')}.`
];
};

const buildEnhancedPrompt = (item) => {
const techniques = levelTechniqueMap[item.level] || levelTechniqueMap.inicio;
const role = resolveRole(item.domain);
const outputFormat = resolveOutputFormat(item);
const qualityCriteria = resolveQualityCriteria(item);
const frame = resolveToneFrame(item, role, outputFormat, qualityCriteria, techniques);
return frame.join('\n');
};

const enrichedPromptItems = promptItems.map((item) => ({
...item,
badPrompt: resolveBadPrompt(item),
badReason: resolveWhyBad(item),
techniques: levelTechniqueMap[item.level] || levelTechniqueMap.inicio,
enhancedPrompt: buildEnhancedPrompt(item)
}));

const imageGlossary = [
{ term: `Prompt de imagen`, def: `La descripción en palabras de lo que querés que la IA dibuje o genere. Cuanto más claro y detallado, mejor el resultado.` },
{ term: `Estilo`, def: `El "cómo se ve": foto realista, ilustración, minimalista, moderno, sobrio, 3D. Define el clima visual de la imagen.` },
{ term: `Composición / encuadre`, def: `Cómo se ubican los elementos: qué va al centro, qué de fondo, si es un primer plano del equipo o un plano general del producto instalado.` },
{ term: `Iluminación`, def: `La luz de la escena: cálida, fría, suave, dura, natural, de estudio. Cambia por completo la sensación de la foto.` },
{ term: `Paleta de colores`, def: `Los colores predominantes. Mantener una paleta fija ayuda a que tu marca se vea coherente en todo el material.` },
{ term: `Relación de aspecto`, def: `La forma del rectángulo: cuadrada (1:1) para redes, vertical (4:5 o 9:16) para historias o folletos, horizontal (16:9) para portadas.` },
{ term: `Resolución`, def: `El tamaño y la nitidez de la imagen. Para pantalla alcanza poco; para imprimir necesitás imágenes grandes y nítidas (alta resolución).` },
{ term: `Imagen de referencia`, def: `Una foto o captura que subís para que la IA la use como punto de partida o inspiración. Clave para editar lo que ya tenés (una foto de un equipo, un cartel, una imagen previa).` },
{ term: `Edición / variación`, def: `Pedirle a la IA que modifique una imagen existente (cambiar fondo, luz, agregar o quitar algo) en vez de crear una desde cero.` },
{ term: `Negativos (qué evitar)`, def: `Decirle a la IA lo que NO querés ("sin texto", "sin personas", "sin fondo recargado"). Acota el resultado y evita sorpresas.` },
{ term: `Iteración`, def: `Mejorar la imagen en varias vueltas: generás, mirás, pedís un ajuste puntual y repetís. Es el método normal, no un fracaso.` },
{ term: `Imagen ilustrativa`, def: `Una imagen generada de cómo se vería una pieza o un trabajo. Conviene aclarar siempre que es ilustrativa y no una foto real de lo entregado.` },
{ term: `Brief visual`, def: `Un mini acuerdo de estilo: paleta, luz, fondo, encuadre y clima. Lo repetís en cada prompt para que las piezas sean coherentes.` },
{ term: `Storyboard`, def: `La secuencia de planos de un video antes de hacerlo. Te permite pensar qué se ve, cuánto dura y qué dice cada parte.` },
{ term: `Texto en pantalla`, def: `Frases cortas que aparecen sobre una imagen o video. Conviene agregarlas vos al final si incluyen precios, WhatsApp o datos exactos.` },
{ term: `Prompt negativo`, def: `Una lista de cosas que no querés que aparezcan: sin texto, sin personas deformes, sin fondo recargado, sin logo inventado.` },
{ term: `Coherencia de marca`, def: `Que tus piezas se reconozcan como parte del mismo negocio: mismos tonos, luz, estilo, tipo de fondo y forma de presentar.` },
{ term: `Edición localizada (por zonas)`, def: `Pedir un cambio en UNA parte de la imagen dejando el resto intacto ("cambiá solo esta pared"). Es la forma profesional de editar sin rehacer todo.` },
{ term: `Máscara / señalar la zona`, def: `Indicar con palabras (o marcando en la herramienta) exactamente qué área tocar: "solo el fondo", "únicamente el equipo del centro".` },
{ term: `Conservar / anclar`, def: `Nombrar lo que NO debe cambiar (proporciones, distribución, aberturas, perspectiva). Sin esto, la IA tiende a reinventar la escena.` },
{ term: `Cambio puntual vs. regeneración`, def: `Un cambio puntual ajusta un detalle; una regeneración rehace toda la imagen y suele alterar medidas y espacios. Para diseños reales, casi siempre querés un cambio puntual.` },
{ term: `Magnitud del cambio`, def: `Cuánto querés mover algo: "sutilmente", "apenas", "un poco más", "bastante". Decir la intensidad evita pasarte.` },
{ term: `Proporciones y escala`, def: `El tamaño relativo de las cosas (la proporción de un equipo, su tamaño respecto del fondo o del auto). Es lo primero que se deforma si no lo cuidás.` },
{ term: `Perspectiva / punto de vista`, def: `Desde dónde se "mira" la escena. Mantener la misma perspectiva permite comparar un antes y un después de verdad.` },
{ term: `Variación controlada`, def: `Pedir alternativas de UN solo elemento (por ejemplo, tres colores de piso) sin cambiar nada más, para elegir sobre seguro.` },
{ term: `Esquema o diagrama`, def: `Representaciones técnicas (un diagrama de conexión, un esquema). La IA puede ilustrarlos, pero no reemplaza el esquema real del equipo.` }

const MemoryPairsGame = ({ data, onReset }) => {
const [cards, setCards] = useState(() => {
return data.pairs.flatMap((pair, i) => [
{ id: i * 2, pairId: i, text: pair[0] },
{ id: i * 2 + 1, pairId: i, text: pair[1] }
]).sort(() => Math.random() - 0.5);
});
const [revealed, setRevealed] = useState([]);
const [matched, setMatched] = useState([]);
const [moves, setMoves] = useState(0);
const [checking, setChecking] = useState(false);

const handleFlip = (cardId) => {
if (checking || revealed.includes(cardId) || matched.includes(cardId)) return;
const newRevealed = [...revealed, cardId];
setRevealed(newRevealed);
if (newRevealed.length === 2) {
setMoves(m => m + 1);
setChecking(true);
const c1 = cards.find(c => c.id === newRevealed[0]);
const c2 = cards.find(c => c.id === newRevealed[1]);
if (c1.pairId === c2.pairId) {
setTimeout(() => { setMatched(p => [...p, c1.id, c2.id]); setRevealed([]); setChecking(false); }, 700);
} else {
setTimeout(() => { setRevealed([]); setChecking(false); }, 1200);
}
}
};

const allDone = matched.length === cards.length;

return (
<div>
    <div className="grid grid-cols-3 md:grid-cols-4 gap-3 mb-4">
        {cards.map(card => {
        const isUp = revealed.includes(card.id) || matched.includes(card.id);
        const isDone = matched.includes(card.id);
        return (
        <button key={card.id} onClick={()=> handleFlip(card.id)}
            className={`p-3 rounded-xl border-2 min-h-[72px] text-center transition-all duration-300 font-medium ${
            isDone ? 'bg-emerald-100 border-emerald-400 text-emerald-800' :
            isUp ? 'bg-indigo-100 border-indigo-400 text-indigo-800' :
            'bg-white border-slate-300 hover:border-indigo-400 hover:bg-indigo-50 cursor-pointer text-slate-400'
            }`}>
            {isUp ? card.text : '?'}
        </button>
        );
        })}
    </div>
    {allDone && (
    <div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">
        <p className="text-emerald-800 font-bold text-lg">🎉 ¡Completaste el desafío en {moves} intentos!</p>
        <button onClick={onReset}
            className="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Jugar de nuevo</button>
    </div>
    )}
    {!allDone && <p className="text-sm text-slate-500 text-center">Intentos: {moves} — Pares encontrados:
        {matched.length / 2} de {data.pairs.length}</p>}
</div>
);
};

const SequenceGame = ({ data, onReset }) => {
const [qi, setQi] = useState(0);
const [score, setScore] = useState(0);
const [picked, setPicked] = useState(null);
const [showHint, setShowHint] = useState(false);
const q = data.questions[qi];
const done = qi >= data.questions.length;

const pick = (i) => {
if (picked !== null) return;
setPicked(i);
if (i === q.correct) setScore(s => s + 1);
};
const next = () => { setPicked(null); setShowHint(false); setQi(i => i + 1); };

if (done) return (
<div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">
    <p className="text-emerald-800 font-bold text-lg">🎉 Completaste {score} de {data.questions.length}</p>
    <button onClick={onReset}
        className="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Reiniciar</button>
</div>
);

return (
<div>
    <p className="text-sm text-slate-500 mb-3">Pregunta {qi + 1} de {data.questions.length}</p>
    <div className="flex items-center gap-2 mb-4 flex-wrap">
        {q.sequence.map((s, i) => (
        <span key={i} className={`px-4 py-2 rounded-lg font-bold text-lg ${s==='?'

    <div className="grid grid-cols-2 gap-3 mb-4">

        <button key={i} onClick={()=> pick(i)} className={`p-3 rounded-xl border-2 font-medium transition-all ${
            picked === null ? 'bg-white border-slate-300 hover:border-indigo-400 cursor-pointer' :
            i === q.correct ? 'bg-emerald-100 border-emerald-400 text-emerald-800' :
            i === picked ? 'bg-rose-100 border-rose-400 text-rose-800' :
            'bg-slate-50 border-slate-200 text-slate-400'
            }`}>{opt}</button>
        ))}
    </div>
    {picked !== null && picked !== q.correct && <p className="text-rose-700 mb-2">Esa no es — intentá otra vez o mirá la
        pista.</p>}
    {picked === q.correct && <p className="text-emerald-700 mb-2 font-medium">¡Correcto! {q.hint}</p>}
    {!showHint && picked !== q.correct && <button onClick={()=> setShowHint(true)} className="text-sm text-indigo-600
        underline mb-2">Ver pista</button>}
    {showHint && <p className="text-sm text-indigo-700 italic mb-2">💡 {q.hint}</p>}
    {picked !== null && <button onClick={next}
        className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Siguiente →</button>}
</div>
);
};

const OrderStepsGame = ({ data, onReset }) => {
const [ei, setEi] = useState(0);
const [selected, setSelected] = useState([]);

const ex = data.exercises[ei];
const done = ei >= data.exercises.length;
const available = shuffled[ei] ? shuffled[ei].filter(s => !selected.includes(s)) : [];
const isCorrect = selected.length === ex?.steps.length && selected.every((s, i) => s === ex.steps[i]);
const isWrong = selected.length > 0 && selected.length === ex?.steps.length && !isCorrect;

const addStep = (step) => { setSelected(p => [...p, step]); };
const reset = () => { setSelected([]); };

if (done) return (
<div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">

const AssociationGame = ({ data, onReset }) => {
const [selectedLeft, setSelectedLeft] = useState(null);
const [matched, setMatched] = useState({});
const [wrong, setWrong] = useState(null);
const shuffledRight = useMemo(() => [...data.pairs.map(p => p[1])].sort(() => Math.random() - 0.5), []);
const allDone = Object.keys(matched).length === data.pairs.length;

const clickLeft = (concept) => { if (matched[concept]) return; setSelectedLeft(concept); setWrong(null); };
const clickRight = (def) => {
if (!selectedLeft || Object.values(matched).includes(def)) return;
const pair = data.pairs.find(p => p[0] === selectedLeft && p[1] === def);
if (pair) { setMatched(p => ({...p, [selectedLeft]: def})); setSelectedLeft(null); }
else { setWrong(def); setTimeout(() => setWrong(null), 800); }
};

return (
<div>
    <div className="grid grid-cols-2 gap-4">
        <div className="space-y-2">
            <p className="text-xs font-bold text-slate-500 mb-1">Conceptos</p>
            {data.pairs.map(([concept], i) => (
            <button key={i} onClick={()=> clickLeft(concept)} className={`w-full text-left p-3 rounded-xl border-2
                transition-all text-sm ${
                matched[concept] ? 'bg-emerald-100 border-emerald-300 text-emerald-700' :
                selectedLeft === concept ? 'bg-indigo-100 border-indigo-400 text-indigo-800 ring-2 ring-indigo-300' :
                'bg-white border-slate-300 hover:border-indigo-400 cursor-pointer'
                }`}>{concept}</button>
            ))}
        </div>

const IntruderGame = ({ data, onReset }) => {
const [gi, setGi] = useState(0);
const [picked, setPicked] = useState(null);
const [score, setScore] = useState(0);
const g = data.groups[gi];
const done = gi >= data.groups.length;

const pick = (i) => { if (picked !== null) return; setPicked(i); if (i === g.intruder) setScore(s => s + 1); };
const next = () => { setPicked(null); setGi(i => i + 1); };

if (done) return (
<div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">
    <p className="text-emerald-800 font-bold text-lg">🎉 Encontraste {score} de {data.groups.length} intrusos</p>
    <button onClick={onReset}
        className="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Reiniciar</button>
</div>
);

return (
<div>
    <p className="text-sm text-slate-500 mb-3">Grupo {gi + 1} de {data.groups.length}</p>
    <div className="flex flex-wrap gap-3 mb-4">
        {g.items.map((item, i) => (
        <button key={i} onClick={()=> pick(i)} className={`px-4 py-3 rounded-xl border-2 font-medium transition-all ${
            picked === null ? 'bg-white border-slate-300 hover:border-indigo-400 cursor-pointer' :
            i === g.intruder ? 'bg-amber-100 border-amber-400 text-amber-800' :
            i === picked && i !== g.intruder ? 'bg-rose-100 border-rose-300 text-rose-700' :
            'bg-slate-50 border-slate-200'
            }`}>{item}</button>
        ))}
    </div>
    {picked !== null && picked === g.intruder && <p className="text-emerald-700 font-medium mb-2">¡Correcto! {g.reason}
    </p>}
    {picked !== null && picked !== g.intruder && <p className="text-rose-700 mb-2">No es ese. El intruso era:
        <strong>{g.items[g.intruder]}</strong>. {g.reason}</p>}
    {picked !== null && <button onClick={next}
        className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Siguiente →</button>}
</div>
);
};

        <div className="max-w-5xl mx-auto px-4 py-3">
            <div className="flex items-center gap-3 mb-3">
                <div
                    className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-md">
                    <BrainCircuit className="w-6 h-6 text-white" />
                </div>
                <div>
                    <h1 className="text-lg font-extrabold text-slate-800 leading-tight">Laboratorio de IA para tu negocio</h1>
                    <p className="text-xs text-slate-500">Audio para autos y electrónica · del taller a la venta</p>
                </div>
            </div>
            <div className="flex gap-1 overflow-x-auto">
                {tabs.map(tab => (
                <button key={tab.id} onClick={()=> { setView(tab.id); setActiveStory(null); }}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap
                    transition-all ${
                    view === tab.id ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'
                    }`}>
                    {tab.icon} {tab.label}
                </button>
                ))}
            </div>
        </div>
    </header>

    <main className="max-w-5xl mx-auto px-4 py-8">
        {/* THEORY VIEW */}
        {view === 'theory' && (
        <div className="flex flex-col md:flex-row gap-6">
            {/* Sidebar - desktop */}
            <aside className="hidden md:block md:w-64 flex-shrink-0">
                <div className="sticky top-32 space-y-1">
                    <p className="text-xs font-bold text-slate-400 uppercase mb-2">Módulos ({theoryModules.length})</p>
                    {theoryModules.map((m, i) => (
                    <button key={m.id} onClick={()=> setModuleIndex(i)}
                        className={`w-full text-left px-3 py-2 rounded-lg text-sm transition-all ${
                        i === moduleIndex ? 'bg-indigo-100 text-indigo-800 font-bold border-l-4 border-indigo-500' :
                        'text-slate-600 hover:bg-slate-100'
                        }`}>
                        <span className="text-xs text-slate-400 mr-1">{i + 1}.</span> {m.title}
                    </button>
                    ))}
                </div>
            </aside>

            {/* Sidebar - mobile dropdown */}
            <div className="md:hidden mb-4">
                <select value={moduleIndex} onChange={e=> setModuleIndex(Number(e.target.value))}
                    className="w-full p-3 rounded-xl border-2 border-slate-300 bg-white text-slate-800 font-medium">
                    {theoryModules.map((m, i) => <option key={m.id} value={i}>{i + 1}. {m.title}</option>)}
                </select>
            </div>

            {/* Content */}
            <div className="flex-1 max-w-3xl">
                <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-6 md:p-8">
                    <p className="text-xs text-indigo-600 font-bold uppercase mb-1">Módulo {moduleIndex + 1} de
                        {theoryModules.length}</p>
                    <h2 className="text-2xl font-extrabold text-slate-800 mb-1">{mod.title}</h2>
                    <p className="text-slate-500 mb-6">{mod.subtitle}</p>

                    <div className="space-y-4 text-slate-700 leading-relaxed mb-8">
                        {mod.reading.map((para, i) => <p key={i}>{para}</p>)}
                    </div>

                    <div className="bg-indigo-50 rounded-xl p-5 border border-indigo-200 mb-6">
                        <h4 className="font-bold text-indigo-800 mb-3 flex items-center gap-2">
                            <CheckCircle2 className="w-4 h-4" /> Checklist
                        </h4>
                        <ul className="space-y-2">
                            {mod.checklist.map((item, i) => (
                            <li key={i} className="flex items-start gap-2 text-indigo-900">
                                <CheckCircle2 className="w-4 h-4 text-indigo-500 mt-1 flex-shrink-0" />
                                <span>{item}</span>
                            </li>
                            ))}
                        </ul>
                    </div>

                    <div className="bg-amber-50 rounded-xl p-5 border border-amber-200 mb-8">
                        <h4 className="font-bold text-amber-800 mb-2 flex items-center gap-2">
                            <Lightbulb className="w-4 h-4" /> Práctica sugerida
                        </h4>
                        <p className="text-amber-900">{mod.practice}</p>
                    </div>

                    <div className="flex items-center justify-between gap-4">
                        <button onClick={()=> setModuleIndex(i => Math.max(0, i - 1))} disabled={moduleIndex === 0}
                            className="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-100 text-slate-700
                            hover:bg-slate-200 disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                            <ChevronLeft className="w-4 h-4" /> Anterior
                        </button>
                        {moduleIndex < theoryModules.length - 1 ? ( <button onClick={()=> setModuleIndex(i => i + 1)}
                            className="flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 text-white
                            hover:bg-indigo-700 transition-all">
                            Siguiente
                            <ChevronRight className="w-4 h-4" />
                            </button>
                            ) : (
                            <button onClick={()=> setView('gym')}
                                className="flex items-center gap-2 px-5 py-2 rounded-lg bg-emerald-600 text-white
                                hover:bg-emerald-700 transition-all font-medium">
                                Continuar al Gimnasio
                                <ArrowUpRight className="w-4 h-4" />
                            </button>
                            )}
                    </div>
                </div>
            </div>
        </div>
        )}

        {/* GYM VIEW */}
        {view === 'gym' &&
        <PromptGym />}

        {/* IMAGES VIEW */}
        {view === 'images' &&
        <ImagesSection />}

        {/* SHEETS VIEW */}
        {view === 'sheets' &&
        <PlanillasSection />}

        {/* NOTEBOOKLM VIEW */}
        {view === 'notebooklm' &&
        <NotebookLMSection />}

        {/* CHALLENGES VIEW */}
        {view === 'challenges' &&
        <ChallengesSection />}

        {/* STORIES VIEW */}
        {view === 'stories' && (
        activeStory ? <StoryPlayer story={activeStory} onBack={()=> setActiveStory(null)} /> : (
            <div>
                <div
                    className="bg-gradient-to-br from-purple-50 to-pink-50 rounded-2xl p-6 mb-6 border border-purple-200 max-w-3xl mx-auto">
                    <h3 className="text-xl font-bold text-purple-800 mb-2 flex items-center gap-2">
                        <MessageCircle className="w-5 h-5" /> Historias de uso
                    </h3>
                    <p className="text-purple-900">Casos reales que muestran cómo mejorar interacciones con IA, paso a
                        paso. Cada historia incluye un prompt reutilizable al final.</p>
                </div>
                <StoriesGallery onSelect={setActiveStory} />
            </div>
            )
            )}
    </main>

    <footer className="bg-white border-t border-slate-200 mt-12">
        <div className="max-w-5xl mx-auto px-4 py-6 text-center text-slate-500 text-sm">
            <p className="font-medium">Laboratorio de IA para tu negocio de audio y electrónica — Material formativo</p>
            <p className="mt-1">Navega las secciones a tu ritmo. Volvé cuando quieras.</p>
        </div>
    </footer>
</div>
);
};

createRoot(document.getElementById('root')).render(
<App />);
</script>
</body>

</html>

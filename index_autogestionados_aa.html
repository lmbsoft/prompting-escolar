        const theoryModules = [
            {
                id: 't1',
                title: 'Qué es la IA generativa y cómo conviene pensarla',
                subtitle: 'Un modelo mental claro para tu desarrollo de departamentos en Mar del Plata',
                reading: [
                    'Una IA generativa no piensa como una persona ni "sabe" cosas como las sabe un arquitecto, un escribano o un contador. Funciona prediciendo, a gran velocidad, qué texto (o qué imagen) es el más probable a partir de patrones que aprendió de enormes volúmenes de información. Cuando le escribís un pedido, calcula la respuesta más plausible. Su fortaleza es combinar ideas, redactar y ordenar; su debilidad es la certeza de cada dato concreto.',
                    'Pensala como un asistente nuevo, muy rápido y muy leído, pero que recién entra a tu obra: puede redactarte el aviso de venta de un departamento, armarte una planilla de avance de obra o proponerte un cronograma en segundos, pero no conoce TU realidad hasta que se la contás. Cuanto mejor le expliques tu contexto (que construís edificios de departamentos para la venta en Mar del Plata, que vendés desde el pozo y también unidades terminadas, a quién le vendés), mejores y más útiles serán sus respuestas.',
                    'Toda la conversación que tenés con la IA forma su "memoria de trabajo" del momento: lee todo lo que escribiste desde el primer mensaje para responder el último. Por eso conviene escribir ordenado y dar contexto: le estás dando mejor materia prima. Si arrancás con un pedido vago, te responde algo genérico; si le das objetivo, contexto y formato, el resultado sube de nivel notablemente.',
                    'Hoy hay varias IA conversacionales importantes: ChatGPT, Claude, Gemini, Copilot y otras. Cada una tiene puntos fuertes distintos: algunas redactan mejor, otras analizan documentos largos (un boleto, un pliego, un presupuesto de obra), otras generan o editan imágenes y renders. No existe "la mejor" en abstracto; existe la más adecuada para cada tarea. Lo importante es perder el miedo a probar: es gratis equivocarse con la IA.',
                    'La regla práctica más importante: no la trates como una autoridad final, tratala como un asistente. Vos seguís siendo el que decide. La IA te acerca borradores, estructuras y opciones; vos ponés el criterio del que conoce el negocio, la ciudad y la obra. Esa combinación —tu experiencia de toda una vida emprendiendo + la velocidad de la IA— es lo que la vuelve una herramienta poderosa.',
                    'Un aviso clave: que una respuesta suene impecable NO garantiza que sea exacta. La IA puede escribir con tono profesional y aun así inventar un precio, una superficie, una fecha de entrega o una norma municipal. En todo lo sensible (cifras, plazos de obra, costos, requisitos legales o de habilitación), separá siempre dos momentos: uno de generación y otro de verificación. Esa disciplina —la misma que aplicás en el dojo y en la obra— te va a evitar problemas.'
                ],
                checklist: [
                    'Antes de escribir, definir para qué quiero usar la IA en esta tarea concreta.',
                    'Darle siempre contexto del negocio: qué construyo, dónde, para quién y en qué etapa está cada cosa.',
                    'Tratar las respuestas como borradores, no como verdades cerradas.',
                    'Verificar fuera del chat todo dato crítico (precios, superficies, plazos, normas, cifras).'
                ],
                practice: 'Ejercicio 1: pedile a la IA que te explique algo que ya dominás (por ejemplo, qué mira un comprador al elegir un departamento, o cómo se certifica el avance de una obra). Marcá qué acertó y qué quedó flojo: así calibrás cuánto confiar. Ejercicio 2: hacele el mismo pedido a dos IA distintas (ChatGPT y Gemini, por ejemplo) y compará. Ese contraste te entrena para usarlas con criterio.'
            },
            {
                id: 't2',
                title: 'La anatomía de un buen prompt',
                subtitle: 'Del pedido difuso a la instrucción que sí te sirve',
                reading: [
                    'Un prompt (la instrucción que le das a la IA) de calidad suele tener cinco piezas: ROL (quién querés que sea), OBJETIVO (qué querés lograr), CONTEXTO (datos de tu situación), FORMATO de salida (cómo querés recibir la respuesta) y CRITERIO de calidad (cómo se evalúa que esté bien). No siempre hace falta usar las cinco, pero cuanto más claro seas, menos ambiguo será el resultado.',
                    'El ROL define el punto de vista de la respuesta. No es lo mismo "actuá como asesor comercial inmobiliario" que "actuá como contador" o "actuá como director de obra". Elegir el rol correcto es como elegir a qué profesional le hacés la consulta. Para tu negocio vas a usar muchos roles distintos según la tarea.',
                    'El OBJETIVO aclara qué buscás. "Ayudame con un aviso" es vago. "Necesito el texto de un aviso para vender una unidad de 2 ambientes al frente, en pozo, con entrega a 18 meses, en un edificio sobre la costa de Mar del Plata" es preciso. El CONTEXTO agrega lo que la IA no puede adivinar: el barrio, el público al que apuntás (inversor o vivienda propia), la forma de pago, los diferenciales del proyecto.',
                    'El FORMATO de salida indica cómo querés la respuesta: una lista, una tabla comparativa, un texto de 5 líneas, una planilla con columnas, un guion. Pedir formato evita las "respuestas-río" (bloques de texto eternos difíciles de aprovechar) y te da algo listo para usar. Por ejemplo: "dame la respuesta como una tabla con columnas Unidad, Tipología, Superficie, Precio".',
                    'El CRITERIO de calidad es lo que separa un prompt bueno de uno excelente. Decir "que quede lindo" es poco. Decir "que el texto sea claro, sin exagerar, que destaque ubicación y entrega, con un llamado a coordinar una visita y que entre en media carilla" le da un estándar concreto contra el cual trabajar.',
                    'Ejemplo de transformación. Difuso: "Haceme algo para vender más rápido el edificio". Útil: "Actuá como redactor publicitario inmobiliario. Escribime tres opciones de texto corto (máximo 4 líneas cada una) para promocionar las últimas unidades de 2 y 3 ambientes de mi edificio en zona costera de Mar del Plata, con tono claro y un cierre que invite a coordinar una visita por WhatsApp. Evitá frases exageradas."',
                    'La técnica más valiosa es ITERAR: leer la primera respuesta, ver qué le falta y pedir una mejora concreta. Que la primera salida no sea perfecta no es un error, es parte del proceso, igual que pulir una kata: se mejora vuelta tras vuelta. Los mejores resultados casi nunca salen al primer intento, sino en la segunda o tercera pasada. Esto vale tanto para textos como —sobre todo— para imágenes y renders.'
                ],
                checklist: [
                    'Asignar un rol claro según la tarea (asesor comercial, contador, director de obra, diseñador).',
                    'Decir para quién es el resultado (inversores, compradores de vivienda, redes, etc.).',
                    'Pedir un formato concreto (tabla, lista, texto de X líneas, planilla).',
                    'Incluir un criterio de calidad y los límites (tono, longitud, qué evitar).',
                    'Iterar al menos una vez antes de dar la respuesta por buena.'
                ],
                practice: 'Tomá un pedido simple que harías hoy ("armame una lista de precios de las unidades") y reescribilo agregando rol + contexto + formato + criterio. Probá las dos versiones en la IA y compará la diferencia. Vas a ver que el segundo resultado es mucho más usable.'
            },
            {
                id: 't3',
                title: 'Trabajar por bloques, sin pedir todo junto',

                reading: [

                    'Pensalo como levantar un edificio: nadie hace todo de una vez. Primero el proyecto y los planos, después la fundación, luego la estructura, las terminaciones y al final los detalles. Con la IA es igual: cada bloque termina con una decisión tuya —seguir, corregir o cambiar el rumbo. Así, si algo sale mal en un paso, no perdés todo el trabajo: corregís ese paso y seguís.',
                    'Una secuencia que funciona muy bien tiene tres fases. Fase exploratoria: "dame un panorama general en 5 puntos". Fase de desarrollo: "ahora desarrollá el punto 3 con detalle". Fase de pulido: "revisá todo y proponé mejoras concretas". Esta forma de avanzar da resultados mejores y más consistentes que un único pedido gigante.',
                    'Esto es especialmente cierto con las imágenes y los renders, donde el detalle importa. Nadie obtiene la pieza perfecta al primer prompt. Se empieza por la idea general (composición, estilo, clima), después se ajusta la luz, después el encuadre, después el texto y el logo. Cada mensaje es un paso más cerca. La paciencia para iterar es, literalmente, la habilidad central de quien usa bien la IA de imágenes.',
                    'Un consejo práctico: al terminar cada bloque, resumí en una línea lo que quedó decidido antes de pedir el siguiente paso. Por ejemplo: "Bien, quedamos en folleto vertical, render del frente, dos tipologías destacadas. Ahora pasemos a la lista de precios." Eso mantiene la conversación ordenada y evita que la IA "olvide" decisiones anteriores cuando se hace larga.'
                ],
                checklist: [
                    'Bloque 1: pedir el panorama o esquema general del trabajo.',
                    'Bloque 2: desarrollar una parte por vez.',
                    'Bloque 3: revisar y pulir la versión final.',
                    'Resumir en una línea lo decidido entre bloque y bloque.'
                ],
                practice: 'En tu próxima tarea con IA, prohibite pedir todo de una vez. Pedí primero solo el esquema, decidí qué te sirve y avanzá paso a paso. Anotá cuántas vueltas necesitaste hasta quedar conforme: es normal que sean varias, y eso está bien.'
            },
            {
                id: 't4',
                title: 'Pedir profundidad sin perderte en tecnicismos',
                subtitle: 'Aprender de verdad, con explicaciones a tu medida',
                reading: [
                    'Una buena consigna para aprender combina profundidad y claridad. Podés pedirle a la IA: "explicámelo bien, pero sin jerga innecesaria, como si me lo contara un colega con paciencia". Y sumar: "dame un ejemplo concreto y también un caso donde esto NO funcione". Ese balance entre rigor y claridad es el que necesitás cuando entrás a un tema nuevo.',
                    'Si algo te queda abstracto, pedí la explicación en tres niveles: breve (un párrafo), detallada (media página) y aplicada (un ejemplo real de tu negocio). Por ejemplo, sobre flujo de fondos de un proyecto: primero qué es en una frase, después cómo funciona, después un ejemplo con la venta en pozo de tu próximo edificio. Elegís el nivel según lo que necesites.',
                    'Decile siempre tu punto de partida: "manejo bien el negocio inmobiliario y la obra, pero con planillas estoy a nivel intermedio" o "uso la computadora a nivel medio". Eso le permite calibrar: no te abruma con lo obvio ni te deja perdido con lo avanzado. Es la mejor forma de que la explicación te quede a medida.',
                    'Una técnica muy útil es pedir lo que NO querés: "no uses términos en inglés sin explicarlos", "no des por sentado que sé programar fórmulas", "no me tires diez opciones, dame las dos mejores". Estas restricciones acotan la respuesta y la vuelven mucho más precisa y digerible.',
                    'Para temas en los que querés profundizar de verdad, pedí síntesis intermedias: "antes de seguir, resumime en 5 puntos lo que vimos". Eso te permite chequear si lo entendiste y no acumular información sin procesar. Es como hacer una pausa entre series: te asegurás de que vas siguiendo el hilo antes de avanzar.'
                ],
                checklist: [

                    'Declarar mi nivel de partida para que calibre la profundidad.',

                    'Pedir síntesis intermedias para confirmar que voy entendiendo.'

                practice: 'Elegí un tema que querés dominar (por ejemplo, fórmulas de planilla para seguir costos de obra). Pedile a la IA que te lo enseñe en tres niveles y que cierre con un mini ejercicio aplicado a tu proyecto. Resolvelo y pedile que te corrija.'
            },
            {
                id: 't5',
                title: 'La IA se equivoca: verificación inteligente',

                reading: [
                    'La IA a veces "alucina": inventa datos, cifras, normas o fuentes que suenan totalmente creíbles pero son falsos. No lo hace por mala intención; es una consecuencia de cómo funciona (predice texto probable, no verdad comprobada). En tu rubro esto es crítico: un precio mal calculado, una norma urbanística inventada, un plazo de obra irreal o un requisito de habilitación falso pueden costarte mucho dinero o problemas legales.',
                    'La regla de oro: cuanto más importante es la decisión, más rigurosa tiene que ser tu verificación. Para una lluvia de ideas o un borrador de aviso, podés ser flexible. Para costos, requisitos municipales, normativa de construcción, plazos de escritura, datos impositivos o cifras que vas a publicar en un brochure, verificá siempre en una fuente oficial o con un profesional (arquitecto, escribano, contador). La IA te ayuda a preparar, no a decidir a ciegas.',
                    'Una técnica muy potente es pedirle a la IA que distinga lo que sabe de lo que supone: "marcá qué partes de esta respuesta son hechos verificables y cuáles son estimaciones o supuestos". También podés pedir: "no inventes datos; si no estás seguro, decímelo". No elimina el riesgo, pero lo reduce y te hace más consciente.',
                    'Con números y planillas, conviene que la IA te muestre el razonamiento, no solo el resultado: "mostrame el cálculo paso a paso para que pueda revisarlo". Así podés detectar si se equivocó en una cuenta. Nunca lleves un total a tu flujo de fondos o a una propuesta de venta sin entender de dónde salió.',

                ],
                checklist: [
                    'Verificar fuera del chat todo dato crítico para el negocio.',
                    'Pedir a la IA que distinga hechos de suposiciones.',
                    'Pedir el cálculo paso a paso cuando hay números de por medio.',

                    'Un buen pedido de búsqueda no es "buscame esto" y listo. Conviene decirle qué tipo de fuente querés: oficial, municipal, provincial, nacional, técnica, de un colegio profesional o de fuentes del mercado inmobiliario. Para una idea de marketing puede servir una nota o un ejemplo de redes; para un requisito de obra, un costo de referencia o una decisión de inversión, necesitás fuentes más confiables.',
                    'También hay que pedir fechas. Una página vieja puede sonar útil y estar desactualizada. Si vas a fijar un precio de lista, comprar materiales, lanzar un emprendimiento o cambiar una práctica comercial, pedile a la IA que indique la fecha de la fuente y qué deberías confirmar antes de actuar. La IA puede ayudarte a encontrar el camino, pero la confirmación final es tuya.',

                    'La fórmula práctica es: explorar chico, probar barato y evaluar con datos. La IA puede ayudarte a imaginar caminos, pero el negocio se cuida probando de a poco. Antes de comprometer fuerte, pedile un primer experimento simple: una preventa de unidades, un sondeo de interesados, una consulta a tres compradores potenciales o una comparación de proveedores.'
                ],

            {

                    'Empecemos por el modelo mental: una planilla son filas y columnas donde cada columna es un tipo de dato (fecha, unidad, rubro, monto) y cada fila es un registro (una venta, un certificado de avance, un gasto). Si mantenés esa disciplina —una columna por tipo de dato, una fila por evento— todo lo demás (sumas, filtros, gráficos) se vuelve fácil. La IA te puede ayudar a diseñar esa estructura antes de cargar nada.',
                    'Para las fórmulas, la IA es una gran aliada. Le podés describir en palabras lo que querés y te da la fórmula lista: "necesito una fórmula que sume los montos solo cuando el rubro sea Albañilería". Te devuelve algo como SUMAR.SI (o SUMIF) y te explica cada parte. Pedile siempre que te explique la fórmula, no solo que te la dé: así aprendés y podés adaptarla.',

{ id: 'p6', level: 'inicio', domain: `Marketing y difusión`, title: `Ideas de publicaciones para una semana`,
objective: `No quedarte sin qué publicar sobre tu emprendimiento.`, prompt: `Proponme 7 ideas de publicaciones (una por día) para difundir mi edificio en venta en Mar del Plata en redes. Para cada idea indicá: tema, imagen sugerida y una frase de texto. Mezclá avance de obra, ubicación, tipologías, detrás de escena y vida en la zona (mar, costa).`, why: `Te da un plan de contenidos simple para sostener presencia.` },
{ id: 'p7', level: 'inicio', domain: `Gestión de obra`, title: `Calendario general de etapas de obra`,
objective: `Organizar las grandes etapas del edificio en el tiempo.`, prompt: `Actúa como planificador de obra. Ayudame a armar un calendario general de etapas para la construcción de un edificio de departamentos: excavación y fundación, estructura, mampostería, instalaciones, terminaciones, finales y habilitación. Indicá hitos típicos y marcá qué debe definir o aprobar el director de obra.`, why: `Te ordena el proyecto y te muestra dónde apoyarte en los profesionales.` },
{ id: 'p8', level: 'inicio', domain: `Registro del proyecto`, title: `Diseño de la hoja de ventas de unidades`,
objective: `Definir qué registrar de cada operación.`, prompt: `Ayudame a diseñar la hoja "Ventas" de la planilla de registro de mi edificio. Decime qué columnas debería tener y por qué cada una es útil para analizar después. Pensá en unidad, tipología, superficie, precio, comprador (anonimizado), forma de pago, estado y fecha.`, why: `Empezás a registrar bien desde el inicio, sin lamentar datos faltantes.` },
{ id: 'p9', level: 'inicio', domain: `Atención al cliente`, title: `Mensaje de WhatsApp para coordinar una visita`,
objective: `Comunicarte con claridad y buen tono.`, prompt: `Redactá un mensaje breve de WhatsApp para coordinar la visita de un interesado a una unidad o a la obra. Debe incluir: saludo, confirmación de la unidad de interés [completar], propuesta de dos horarios, qué llevar/qué verá y un cierre amable. Dame dos versiones: una más formal y una más cercana.`, why: `Profesionaliza tu comunicación cotidiana con los interesados.` },
{ id: 'p10', level: 'inicio', domain: `Vida activa y artes marciales`, title: `Rutina de acondicionamiento para artista marcial`,
objective: `Sostener tu entrenamiento de karate con cuidado a los 60.`, prompt: `Actúa como preparador físico con experiencia en artistas marciales maduros. Armame una rutina semanal de acondicionamiento para sostener mi práctica de Karate Shotokan SKIF a los 60: movilidad, fuerza, equilibrio y cuidado de articulaciones, compatible con surf y pesca los fines de semana. Indicá días, duración y un objetivo por sesión. No reemplaces el consejo médico.`, why: `Ordena tu actividad física y cuida tu energía para el trabajo y el dojo.` },
{ id: 'p11', level: 'inicio', domain: `Cronograma de obra`, title: `Cuenta regresiva para una entrega de unidades`,
objective: `Preparar con anticipación la entrega.`, prompt: `Faltan [X semanas] para la entrega de las primeras unidades de mi edificio. Armame una cuenta regresiva con las tareas a preparar cada semana: finales de obra, limpieza, mediciones, documentación para escrituras, aviso a compradores y posventa. Formato de checklist por semana.`, why: `Llegás a la entrega organizado y sin improvisar.` },
{ id: 'p12', level: 'inicio', domain: `Imágenes para difusión`, title: `Tu primer prompt de imagen de ambiente`,
objective: `Generar una imagen atractiva de un ambiente del proyecto.`, prompt: `Actúa como director de arte de fotografía de interiores. Dame un prompt detallado, en español, para generar una imagen realista de un living luminoso con vista al mar, estilo moderno y cálido, luz natural de tarde, para difundir un departamento en Mar del Plata. Aclará que es una imagen ilustrativa. Explicame por qué cada detalle del prompt importa.`, why: `Aprendés a describir una imagen para que la IA la genere bien.` },
{ id: 'p13', level: 'inicio', domain: `Aprendizaje con IA`, title: `Plan para aprender IA en 4 semanas`,
objective: `Avanzar con método y sin dispersarte.`, prompt: `Diseñame un plan de 4 semanas para aprender a usar IA en mi negocio de construcción y venta de departamentos, con sesiones de 30 minutos, 4 días por semana. Cada semana con un foco (textos de venta, planillas de obra, imágenes/renders, organización) y un resultado concreto al final. Cerrá cada semana con una mini meta.`, why: `Transforma el entusiasmo en una práctica sostenida.` },
{ id: 'p14', level: 'inicio', domain: `Proveedores y materiales`, title: `Comparar opciones de un material o servicio`,
objective: `Decidir una compra de obra con criterios claros.`, prompt: `Necesito comparar tres opciones para [material o servicio: aberturas / pisos / ascensor / empresa de movimiento de suelos]. Armá una tabla con criterios: precio, calidad, plazo de entrega, garantía y proveedor. Después dame una recomendación según si priorizo precio, calidad o cumplimiento de plazo. No inventes precios: dejá [completar].`, why: `Te ayuda a decidir con datos ordenados en vez de a ojo.` },
{ id: 'p15', level: 'inicio', domain: `Organización del negocio`, title: `Ordenar las tareas del día`,
objective: `Empezar el día con foco.`, prompt: `Ayudame a ordenar mis tareas del día entre obra, ventas y gestión. Te paso una lista desordenada [pegar lista] y quiero que la organices por prioridad e indiques cuáles puedo delegar o hacer con ayuda de IA. Formato: lista numerada con una nota breve por tarea.`, why: `Convierte una lista caótica en un plan claro de jornada.` },
{ id: 'p16', level: 'inicio', domain: `Redes sociales`, title: `Texto para presentar el emprendimiento`,
objective: `Contar qué construís y qué ofrecés.`, prompt: `Escribime un texto de presentación (estilo "acerca de") para el perfil de mi emprendimiento de departamentos en Mar del Plata. Tono claro y confiable, que transmita trayectoria, calidad de construcción y buena ubicación. Máximo 6 líneas. Dame dos versiones, una más sobria y una más cálida.`, why: `Te da una carta de presentación lista para tus perfiles.` },
{ id: 'p17', level: 'inicio', domain: `Finanzas y costos`, title: `Entender el costo de una unidad`,
objective: `Saber cuánto te cuesta producir para fijar precio.`, prompt: `Ayudame a listar todos los costos que debería considerar para estimar el costo de una unidad (incidencia del terreno, construcción por m2, instalaciones, terminaciones, honorarios profesionales, impuestos y comercialización). Hacé una lista ordenada por categoría. No inventes montos: dejá [completar] en cada ítem para que yo cargue.`, why: `Te da el esqueleto para calcular costos reales y fijar precios con criterio.` },
{ id: 'p18', level: 'inicio', domain: `Control de obra y calidad`, title: `Checklist de recepción de un departamento`,
objective: `Estandarizar la calidad de las unidades antes de entregar.`, prompt: `Actúa como responsable de control de calidad de obra. Armame una checklist de recepción de un departamento antes de entregarlo: terminaciones, aberturas, instalaciones eléctricas y sanitarias, pintura, grifería, detalles de carpintería. Formato de lista verificable con qué observar en cada punto.`, why: `Una entrega pareja y prolija genera confianza y evita reclamos.` },

// ─── NIVEL PROFUNDIZAR ───
{ id: 'p19', level: 'profundizar', domain: `Lista de precios`, title: `Política de precios por avance de obra`,
objective: `Diseñar una estrategia de precios escalonada.`, prompt: `Ayudame a estructurar una lógica de precios que suba según el avance de obra (pozo, en construcción, terminado) y según orientación y piso. Armá la tabla con la lógica de los tramos y dejá los valores como [completar]. Sugerí buenas prácticas para premiar al que compra temprano sin resentir el resultado del proyecto.`, why: `Ordena tu estrategia comercial y protege la rentabilidad del emprendimiento.` },
{ id: 'p20', level: 'profundizar', domain: `Planilla de cálculo`, title: `Modelo de margen por tipología`,
objective: `Calcular automáticamente el resultado de cada tipología.`, prompt: `Ayudame a armar en una planilla un modelo donde, ingresando costo estimado y precio de venta de cada tipología, calcule automáticamente el margen en pesos y en porcentaje. Indicame qué columnas crear, qué fórmulas poner en cada una y cómo verificar que el cálculo está bien. Excel y Google Sheets.`, why: `Ves de un vistazo qué tipología te deja más rentabilidad.` },
{ id: 'p21', level: 'profundizar', domain: `Marketing y difusión`, title: `Campaña de lanzamiento del edificio`,
objective: `Planificar varias semanas de comunicación.`, prompt: `Actúa como redactor publicitario inmobiliario. Diseñame una campaña de difusión de 3 semanas para el lanzamiento de mi edificio en Mar del Plata. Incluí objetivo, mensaje central, calendario de publicaciones, y para cada semana 3 ideas de contenido con su imagen sugerida. Tono honesto, destacando ubicación, calidad y entrega. Sin promesas exageradas.`, why: `Pasás de publicar suelto a una campaña con hilo conductor.` },
{ id: 'p22', level: 'profundizar', domain: `Registro del proyecto`, title: `Libro de registro completo del proyecto`,
objective: `Diseñar tu sistema de registro integral.`, prompt: `Ayudame a diseñar un libro de registro en planilla para mi edificio, con hojas conectadas: Unidades/Ventas, Compradores (anonimizados), Costos de obra y Caja/Flujo. Para cada hoja, decime las columnas y cómo se relacionan entre sí (por ejemplo, traer el precio de la unidad desde la hoja Unidades a la hoja Ventas con BUSCARX). Explicá el porqué de cada decisión.`, why: `Te da una base de gestión profesional que crece con el proyecto.` },
{ id: 'p23', level: 'profundizar', domain: `Imágenes para difusión`, title: `Brief para una serie de imágenes coherentes`,
objective: `Lograr varias imágenes con un mismo estilo de marca.`, prompt: `Actúa como director de arte. Quiero generar una serie de 5 imágenes de ambientes con un estilo coherente para mi emprendimiento (moderno, cálido, luminoso, con presencia del mar). Dame un "brief" de estilo (paleta, luz, materiales, encuadre) y luego 5 prompts, uno por ambiente (living, dormitorio, cocina, balcón con vista, frente del edificio), que respeten ese estilo. Explicá cómo mantener la coherencia.`, why: `Aprendés a construir una identidad visual, no imágenes sueltas.` },
{ id: 'p24', level: 'profundizar', domain: `Atención al cliente`, title: `Manual de respuestas para situaciones difíciles`,
objective: `Manejar reclamos y casos delicados con buen criterio.`, prompt: `Ayudame a redactar respuestas para 5 situaciones difíciles con compradores: demora en la entrega de obra, un detalle de terminación a corregir, pedido de descuento, consulta por un cambio de plano y reclamo por expensas. Para cada una: una respuesta empática, firme y orientada a solución, cuidando lo que conviene poner por escrito.`, why: `Te prepara para resolver con profesionalismo los momentos tensos.` },
{ id: 'p25', level: 'profundizar', domain: `Finanzas y costos`, title: `Punto de equilibrio del emprendimiento`,
objective: `Saber cuántas unidades necesitás vender para cubrir la obra.`, prompt: `Ayudame a entender y calcular el punto de equilibrio del emprendimiento: cuántas unidades necesito vender (o qué porcentaje) para cubrir el costo total de obra y los costos fijos. Explicame el concepto con un ejemplo simple, decime qué datos necesito y cómo armarlo en una planilla. No inventes mis números: guiame para cargarlos.`, why: `Te da una brújula financiera para decidir el ritmo de ventas y de obra.` },
{ id: 'p26', level: 'profundizar', domain: `Logística de obra`, title: `Organizar acopio y entregas de materiales`,
objective: `Coordinar el ingreso de materiales a la obra.`, prompt: `Actúa como coordinador de logística de obra. Ayudame a organizar el acopio y la recepción de materiales para mi edificio (qué pedir antes de cada etapa, control al recibir, espacio de acopio, cuidado de robos y deterioro). Para cada punto: qué controlar y un consejo práctico. Formato de tabla o checklist por etapa.`, why: `Ordena una parte que suele generar demoras, pérdidas y costos extra.` },
{ id: 'p27', level: 'profundizar', domain: `Dispositivos digitales`, title: `Configurar respaldo en la nube`,
objective: `Proteger la información del proyecto.`, prompt: `Actúa como instructor digital paciente. Guiame paso a paso para configurar una copia de seguridad automática de mis planillas, planos y fotos de obra en la nube. Explicame primero las opciones (Google Drive, OneDrive) con sus ventajas, y después el paso a paso de la que recomiendes para alguien con conocimientos intermedios.`, why: `Evita la catástrofe de perder los registros y las fotos del proyecto.` },
{ id: 'p28', level: 'profundizar', domain: `Gestión de obra`, title: `Preguntas inteligentes para el arquitecto o director de obra`,
objective: `Aprovechar al máximo la reunión con el profesional.`, prompt: `Voy a reunirme con el arquitecto/director de obra por mi edificio. Ayudame a preparar 10 preguntas inteligentes y ordenadas por tema (plazos, costos y desvíos, calidad de terminaciones, instalaciones, seguridad e higiene, documentación). No me des recomendaciones técnicas: solo ayudame a preguntar mejor para aprovechar la reunión.`, why: `Llegás preparado y sacás más valor de cada reunión técnica.` },
{ id: 'p29', level: 'profundizar', domain: `Seguridad de datos`, title: `Anonimizar la planilla de compradores`,
objective: `Analizar datos sin exponer información sensible.`, prompt: `Actúa como asesor de seguridad digital. Quiero que la IA me analice mi planilla de ventas, pero sin exponer datos de compradores. Explicame cómo reemplazar nombres, DNI y teléfonos por códigos genéricos manteniendo la utilidad del análisis, y dame un mini procedimiento para hacerlo rápido cada vez.`, why: `Te permite usar la IA con tus datos cuidando a tus compradores.` },
{ id: 'p30', level: 'profundizar', domain: `Comercialización`, title: `Guion para presentar el edificio a un inversor`,
objective: `Presentar tu proyecto a un comprador grande.`, prompt: `Actúa como asesor comercial inmobiliario. Ayudame a preparar un guion breve para presentarle mi edificio a un inversor (que compra varias unidades o busca renta). Incluí: presentación del proyecto y ubicación, diferenciales, números de inversión y renta estimada con [completar], y manejo de objeciones frecuentes. Tono profesional y honesto.`, why: `Te da seguridad y estructura para cerrar operaciones importantes.` },
{ id: 'p31', level: 'profundizar', domain: `Redes sociales`, title: `Calendario mensual de contenidos`,
objective: `Planear un mes entero de presencia.`, prompt: `Diseñame un calendario de contenidos para un mes (4 semanas) para mi emprendimiento de departamentos. Equilibrá tipos de publicación: avance de obra, tipología destacada, ubicación y vida en Mar del Plata, testimonio o consulta frecuente, y promoción. Entregalo como tabla con columnas: semana, día, tipo, tema, imagen sugerida y texto breve.`, why: `Sostenés presencia sin improvisar cada día qué publicar.` },
{ id: 'p32', level: 'profundizar', domain: `Control de obra y calidad`, title: `Protocolo de control de avance por escrito`,
objective: `Documentar un proceso clave para estandarizarlo.`, prompt: `Actúa como responsable de control de obra. Ayudame a redactar un protocolo de control de avance por etapa para que cualquiera del equipo lo siga igual: qué se controla al cerrar cada etapa (estructura, mampostería, instalaciones, terminaciones), registro fotográfico, firmas y criterios para dar por aprobada la etapa. Dejá [completar] donde van mis valores y responsables.`, why: `Estandariza la calidad y facilita discutir avances con los contratistas.` },
{ id: 'p33', level: 'profundizar', domain: `Organización del negocio`, title: `Rutina semanal de gestión`,
objective: `Que la gestión no se acumule.`, prompt: `Ayudame a diseñar una rutina semanal de gestión para mi negocio, de 30 minutos por día: qué revisar cada día (avance de obra, ventas y consultas, costos, redes, planificación). Formato de tabla por día con la tarea y su objetivo. Que sea realista para alguien que también está mucho en la obra y en la calle.`, why: `Convierte la gestión en un hábito liviano y constante.` },

// ─── NIVEL PROYECTAR ───
{ id: 'p34', level: 'proyectar', domain: `Plan de proyecto`, title: `Plan de comercialización del edificio`,
objective: `Diseñar la estrategia comercial completa del emprendimiento.`, prompt: `Actúa como consultor de proyectos inmobiliarios. Ayudame a diseñar el plan de comercialización de mi edificio por fases: 1) diagnóstico (unidades, mix de tipologías, público objetivo), 2) objetivos de venta y ritmo, 3) precios y financiación, 4) difusión y canales, 5) seguimiento. Para cada fase: acciones, entregables y un indicador para saber si voy bien.`, why: `Te da una hoja de ruta integral, no acciones sueltas.` },
{ id: 'p35', level: 'proyectar', domain: `Imágenes para difusión`, title: `Identidad visual del emprendimiento`,
objective: `Definir el estilo gráfico de todo el material.`, prompt: `Actúa como director de arte y diseñador de marca. Ayudame a definir, por fases, la identidad visual de mi emprendimiento de departamentos: 1) valores y personalidad, 2) paleta de colores y tipo de imágenes/renders, 3) cómo se vería un logo simple, 4) cómo aplicarla en cartel de obra, brochure y redes. Para cada fase dame opciones y un prompt de imagen para explorarla.`, why: `Unifica todo tu material bajo una imagen coherente y memorable.` },
{ id: 'p36', level: 'proyectar', domain: `Plan de proyecto`, title: `Plan para vender desde el pozo`,
objective: `Estructurar una preventa ordenada.`, prompt: `Actúa como consultor de proyectos inmobiliarios. Quiero organizar la venta desde el pozo de mi próximo edificio. Diseñá un plan por fases: qué necesito (documentación, fideicomiso o forma legal con mi escribano, lista de precios, material de venta), cómo conseguir los primeros compradores, qué riesgos cuidar y un primer paso muy concreto para este mes. Marcá qué debe definir un profesional.`, why: `Convierte una idea grande en pasos manejables y accionables.` },
{ id: 'p37', level: 'proyectar', domain: `Planilla de cálculo`, title: `Tablero de control del proyecto`,
objective: `Tener todos los indicadores en una vista.`, prompt: `Ayudame a diseñar, por etapas, un tablero de control (dashboard) simple en planilla para mi edificio: unidades vendidas y disponibles, ritmo de venta, avance de obra, costo incurrido vs. presupuesto y caja. Indicame qué hojas y tablas dinámicas necesito, cómo conectar los datos y cómo armar 3 o 4 gráficos clave. Empezá por la estructura y avanzá paso a paso.`, why: `Te da una sala de comando para decidir con datos de un vistazo.` },
{ id: 'p38', level: 'proyectar', domain: `Pensamiento estratégico`, title: `Escenarios para el próximo emprendimiento`,
objective: `Anticipar y prepararte para distintos futuros.`, prompt: `Actúa como analista de escenarios. Ayudame a proyectar tres escenarios para mi próximo edificio (optimista, realista, adverso) según variables como costo de construcción, valor del m2 y ritmo de ventas. Para cada escenario: qué supone, qué oportunidad y qué riesgo trae, y qué prepararía desde ahora. Cerrá con decisiones que sirven en los tres casos.`, why: `Te prepara para lo que venga en vez de reaccionar tarde.` },
{ id: 'p39', level: 'proyectar', domain: `Plan de proyecto`, title: `Evaluar un terreno para un nuevo proyecto`,
objective: `Analizar una oportunidad de suelo con criterio.`, prompt: `Actúa como consultor de desarrollo inmobiliario. Ayudame a evaluar, por fases, un terreno para un futuro edificio en Mar del Plata. Para cada fase: qué averiguar (zonificación e indicadores urbanísticos, entorno, demanda de la zona, factibilidad), qué profesionales consultar, qué números estimar y qué riesgos cuidar. Priorizá los pasos según costo e información disponible. No inventes datos normativos: marcá qué verificar.`, why: `Te ordena la decisión de comprar suelo, que es la más importante y arriesgada.` },
{ id: 'p40', level: 'proyectar', domain: `Organización del negocio`, title: `Sistema personal de trabajo con IA`,
objective: `Integrar la IA a tu rutina de forma estable.`, prompt: `Ayudame a diseñar mi sistema personal para trabajar con IA en el negocio: qué tareas le delego (textos de venta, planillas de obra, imágenes/renders, organización), qué prompts guardo como plantillas, cuándo verifico y cómo mido si me está ahorrando tiempo. Entregalo por fases, con un set inicial de 5 plantillas de prompt para mis tareas más frecuentes.`, why: `Hace que la IA se vuelva parte estable de tu forma de trabajar.` },

// ─── NIVEL INICIO (continuación) ───
{ id: 'p41', level: 'inicio', domain: `Guías para compradores`, title: `Guía simple para quien compra en pozo`,
objective: `Dar valor a tus interesados con contenido útil.`, prompt: `Actuá como asesor inmobiliario que educa al comprador. Armame una guía simple de 6 puntos para alguien que evalúa comprar un departamento en pozo (qué mirar, qué preguntar, formas de pago, plazos, resguardos legales con su escribano). Tono claro y honesto, sin presionar a comprar. Para compartir como contenido de valor.`, why: `El contenido útil acerca compradores y posiciona tu seriedad.` },
{ id: 'p42', level: 'inicio', domain: `Eventos y muestras`, title: `Checklist para una jornada de venta o open house`,
objective: `No olvidarte nada el día del evento.`, prompt: `Actuá como organizador de eventos comerciales. Armame una checklist para una jornada de venta / open house de mi edificio (en la unidad muestra o en la oficina de ventas): cartelería, material impreso, renders, café/recepción, registro de interesados y seguimiento. Formato de lista verificable por bloques (antes, durante, después).`, why: `Llegás al evento preparado y das una imagen profesional.` },
{ id: 'p43', level: 'inicio', domain: `Gestión del tiempo`, title: `Organizar la semana entre obra, venta y vida`,
objective: `Equilibrar el trabajo y tu tiempo personal.`, prompt: `Actuá como asesor de productividad. Ayudame a organizar una semana tipo que combine visitas a obra, atención a interesados, gestión (planilla, llamados) y mis espacios personales (entrenamiento de karate, surf o pesca). Dame una grilla por día con bloques de tiempo realistas para alguien activo que no quiere vivir pegado al trabajo.`, why: `Evita que la gestión se coma el tiempo del mar y del dojo.` },
{ id: 'p44', level: 'inicio', domain: `Cartelería y señalética`, title: `Qué información debe llevar el cartel de obra`,
objective: `Armar un cartel de venta claro y correcto.`, prompt: `Actuá como diseñador de cartelería inmobiliaria. Decime qué información debería incluir el cartel de venta de mi obra (nombre del emprendimiento, tipologías, "vendo en pozo/terminado", contacto/WhatsApp, web, datos profesionales obligatorios) y cómo jerarquizarla para que se lea desde lejos. Marcá qué datos conviene verificar antes de imprimir.`, why: `Un cartel claro y completo transmite seriedad y capta consultas.` },
{ id: 'p45', level: 'inicio', domain: `Atención al cliente`, title: `Mensaje de posventa y agradecimiento`,
objective: `Cuidar el vínculo después de la operación.`, prompt: `Redactá un mensaje breve y cálido para enviarle a un comprador después de la firma o la entrega: agradecimiento, recordatorio de un dato útil (garantía, posventa, contacto) y disponibilidad para lo que necesite. Dame dos versiones, una más corta y una un poco más completa.`, why: `El cuidado posventa convierte un comprador en alguien que te recomienda.` },
{ id: 'p46', level: 'inicio', domain: `Redes sociales`, title: `Pie de foto para una publicación`,
objective: `Acompañar una imagen con buen texto.`, prompt: `Escribime tres opciones de pie de foto para una publicación con una imagen de avance de obra de mi edificio. Tono cercano y confiable, con un emoji o dos como mucho, una frase que cuente algo del proyecto o la ubicación y un cierre que invite a consultar. Máximo 3 líneas cada uno.`, why: `Una buena imagen rinde más con un texto que conecte.` },
{ id: 'p47', level: 'inicio', domain: `Marketing y difusión`, title: `Promoción para impulsar ventas`,

const resolveRole = (domain) => roleByDomain[domain.toLowerCase()] || `asistente experto en diseño de prompts`;

const resolveOutputFormat = (item) => {
const domain = item.domain.toLowerCase();
if (domain.includes('escritura') || domain.includes('editorial') || domain.includes('divulgación') ||
domain.includes('legado') || domain.includes('memorias') || domain.includes('guías') || domain.includes('guía')) return `Estructura en apartados con subtítulos y un bloque
final de mejora.`;
if (domain.includes('docencia') || domain.includes('curso') || domain.includes('capacitación') || domain.includes('transferencia')) return `Tabla por
sesiones con objetivo, actividad, evidencia y cierre.`;
if (domain.includes('investigación') || domain.includes('fuentes') || domain.includes('búsqueda') || domain.includes('ciencia')) return `Matriz con
columnas y estado de verificación.`;
if (domain.includes('multimedia') || domain.includes('video') || domain.includes('storyboard')) return `Storyboard o

const resolveBadPrompt = (item) => {
const domainKey = item.domain.toLowerCase();
if (weakPromptByDomain[domainKey]) return weakPromptByDomain[domainKey];
if (item.level === 'inicio') return `Necesito ayuda con ${item.domain.toLowerCase()} para
${item.objective.toLowerCase()}.`;
if (item.level === 'profundizar') return `Trabaja este tema: ${item.title}. Dame una versión útil para hoy.`;
return `Resuelve completo este proyecto: ${item.title}.`;
};

const resolveWhyBad = (item) => {
if (item.level === 'inicio') return `Es específico en tema, pero no define público, formato de salida ni criterios para
evaluar si la respuesta sirve.`;
if (item.level === 'profundizar') return `Pide una tarea exigente, pero no fija alcance, límites ni método de revisión.
La salida puede quedar correcta en apariencia y floja en calidad.`;
return `Intenta resolver un proyecto complejo de una sola vez, sin fases ni entregables intermedios. Eso aumenta errores
y reduce control de autoría.`;
};

const resolveQualityCriteria = (item) => {
const domain = item.domain.toLowerCase();
if (domain.includes('escritura') || domain.includes('editorial') || domain.includes('memorias') ||
domain.includes('legado') || domain.includes('guías') || domain.includes('guía')) return `coherencia argumental, voz propia, transiciones y cierre con sentido`;
if (domain.includes('docencia') || domain.includes('curso') || domain.includes('aprendizaje') ||
domain.includes('capacitación') || domain.includes('transferencia')) return `claridad didáctica, secuencia progresiva, actividad aplicable y evidencia de
comprensión`;
if (domain.includes('investigación') || domain.includes('fuentes') || domain.includes('búsqueda') || domain.includes('ciencia')) return `trazabilidad
de fuentes, distinción entre verificado/pendiente y riesgos de error`;
if (domain.includes('multimedia') || domain.includes('video') || domain.includes('storyboard')) return `coherencia visual,
claridad del mensaje, control de textos exactos y factibilidad de producción`;
if (domain.includes('evaluación estratégica')) return `criterios explícitos, supuestos visibles, riesgos concretos y
primer experimento verificable`;
if (domain.includes('comunicación') || domain.includes('entrevista') || domain.includes('familiar')) return `tono
adecuado, intención explícita, reducción de ambigüedad y salida accionable`;
if (domain.includes('proyecto') || domain.includes('estratégico') || domain.includes('iniciativa') ||
domain.includes('impacto')) return `fases realistas, hitos verificables, riesgos y plan de mitigación`;
if (domain.includes('matemáticas') || domain.includes('lógica')) return `precisión del razonamiento, claridad de cada
paso y verificabilidad del resultado`;
if (domain.includes('salud') || domain.includes('vida activa') || domain.includes('artes marciales') || domain.includes('bienestar')) return `límites claros entre autocuidado y consulta
profesional, lenguaje no alarmista`;
if (domain.includes('seguridad') || domain.includes('trámites')) return `pasos verificables, canales oficiales
identificados y alertas de riesgo`;
if (domain.includes('precio') || domain.includes('finanzas') || domain.includes('costo') || domain.includes('planilla') || domain.includes('registro')) return `exactitud de los cálculos, claridad de las fórmulas y verificabilidad de cada número`;
if (domain.includes('imágen') || domain.includes('imagen') || domain.includes('marketing') || domain.includes('difusión') || domain.includes('redes') || domain.includes('cartelería')) return `claridad del estilo, coherencia de marca, honestidad del mensaje y formato listo para usar`;
if (domain.includes('obra') || domain.includes('cronograma') || domain.includes('control') || domain.includes('calidad') || domain.includes('sustentable')) return `pasos verificables, criterios de control claros y respeto del criterio profesional`;
if (domain.includes('cliente') || domain.includes('comprador') || domain.includes('comercial') || domain.includes('logística') || domain.includes('proveedor') || domain.includes('material') || domain.includes('evento') || domain.includes('entorno')) return `tono adecuado, propuesta accionable y reducción de ambigüedad`;
return `claridad, utilidad práctica, control de supuestos y siguiente paso concreto`;
};

const resolveToneFrame = (item, role, outputFormat, qualityCriteria, techniques) => {
if (item.level === 'inicio') {
return [
`Actúa como ${role} con tono cercano, claro y paciente.`,
``, `Meta de esta sesión: ${item.objective}`,
`Pedido base: ${item.prompt}`,
``, `Trabajemos paso a paso:`,
`- Si falta contexto, hazme primero 2 o 3 preguntas breves de calibración.`,
`- Evita tecnicismos innecesarios y usa ejemplos concretos.`,
`- Formato de salida solicitado: ${outputFormat}`,
`- Cierra con una mini revisión de calidad (criterios: ${qualityCriteria}).`,
``, `Antes de cerrar, sugiere una versión 2 de este pedido para mejorar precisión sin complejizar de más.`,
`Técnicas aplicadas: ${techniques.join(', ')}.`
];
}
if (item.level === 'profundizar') {
return [
`Actúa como ${role} con enfoque riguroso y criterio crítico.`,
``, `Objetivo de trabajo: ${item.objective}`,
`Consigna inicial: ${item.prompt}`,
``, `Condiciones metodológicas:`,
`1) Si hay ambigüedad, abre con preguntas de calibración antes de producir la versión final.`,
`2) Entrega una propuesta estructurada, con supuestos explícitos y justificación breve por bloque.`,
`3) Respeta este formato de salida: ${outputFormat}`,
`4) Incluye control de calidad al final con estos criterios: ${qualityCriteria}.`,
`5) Señala qué conviene iterar en una segunda ronda y por qué.`,
``, `Técnicas aplicadas en este prompt: ${techniques.join(', ')}.`
];
}
return [
`Actúa como ${role} con enfoque estratégico y orientación a ejecución.`,
``, `Resultado buscado: ${item.objective}`,
`Desafío base: ${item.prompt}`,
``, `Diseña la respuesta como un plan por fases:`,
`Fase 1 - Delimitación: supuestos, alcance y preguntas críticas de calibración.`,
`Fase 2 - Diseño: propuesta principal en formato solicitado (${outputFormat}).`,
`Fase 3 - Implementación: hitos, entregables y métricas de avance.`,
`Fase 4 - Control: riesgos, límites y revisión final con criterios (${qualityCriteria}).`,
``, `Cierre obligatorio: incluye una versión 2 del pedido para iterar con mayor precisión y menor riesgo.`,
`Técnicas aplicadas: ${techniques.join(', ')}.`
];
};

const buildEnhancedPrompt = (item) => {
const techniques = levelTechniqueMap[item.level] || levelTechniqueMap.inicio;
const role = resolveRole(item.domain);
const outputFormat = resolveOutputFormat(item);
const qualityCriteria = resolveQualityCriteria(item);
const frame = resolveToneFrame(item, role, outputFormat, qualityCriteria, techniques);
return frame.join('\n');
};

const enrichedPromptItems = promptItems.map((item) => ({
...item,
badPrompt: resolveBadPrompt(item),
badReason: resolveWhyBad(item),
techniques: levelTechniqueMap[item.level] || levelTechniqueMap.inicio,
enhancedPrompt: buildEnhancedPrompt(item)
}));

const MemoryPairsGame = ({ data, onReset }) => {
const [cards, setCards] = useState(() => {
return data.pairs.flatMap((pair, i) => [
{ id: i * 2, pairId: i, text: pair[0] },
{ id: i * 2 + 1, pairId: i, text: pair[1] }
]).sort(() => Math.random() - 0.5);
});
const [revealed, setRevealed] = useState([]);
const [matched, setMatched] = useState([]);
const [moves, setMoves] = useState(0);
const [checking, setChecking] = useState(false);

const handleFlip = (cardId) => {
if (checking || revealed.includes(cardId) || matched.includes(cardId)) return;
const newRevealed = [...revealed, cardId];
setRevealed(newRevealed);
if (newRevealed.length === 2) {
setMoves(m => m + 1);
setChecking(true);
const c1 = cards.find(c => c.id === newRevealed[0]);
const c2 = cards.find(c => c.id === newRevealed[1]);
if (c1.pairId === c2.pairId) {
setTimeout(() => { setMatched(p => [...p, c1.id, c2.id]); setRevealed([]); setChecking(false); }, 700);
} else {
setTimeout(() => { setRevealed([]); setChecking(false); }, 1200);
}
}
};

const allDone = matched.length === cards.length;

return (
<div>
    <div className="grid grid-cols-3 md:grid-cols-4 gap-3 mb-4">
        {cards.map(card => {
        const isUp = revealed.includes(card.id) || matched.includes(card.id);
        const isDone = matched.includes(card.id);
        return (
        <button key={card.id} onClick={()=> handleFlip(card.id)}
            className={`p-3 rounded-xl border-2 min-h-[72px] text-center transition-all duration-300 font-medium ${
            isDone ? 'bg-emerald-100 border-emerald-400 text-emerald-800' :
            isUp ? 'bg-indigo-100 border-indigo-400 text-indigo-800' :
            'bg-white border-slate-300 hover:border-indigo-400 hover:bg-indigo-50 cursor-pointer text-slate-400'
            }`}>
            {isUp ? card.text : '?'}
        </button>
        );
        })}
    </div>
    {allDone && (
    <div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">
        <p className="text-emerald-800 font-bold text-lg">🎉 ¡Completaste el desafío en {moves} intentos!</p>
        <button onClick={onReset}
            className="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Jugar de nuevo</button>
    </div>
    )}
    {!allDone && <p className="text-sm text-slate-500 text-center">Intentos: {moves} — Pares encontrados:
        {matched.length / 2} de {data.pairs.length}</p>}
</div>
);
};

const SequenceGame = ({ data, onReset }) => {
const [qi, setQi] = useState(0);
const [score, setScore] = useState(0);
const [picked, setPicked] = useState(null);
const [showHint, setShowHint] = useState(false);
const q = data.questions[qi];
const done = qi >= data.questions.length;

const pick = (i) => {
if (picked !== null) return;
setPicked(i);
if (i === q.correct) setScore(s => s + 1);
};
const next = () => { setPicked(null); setShowHint(false); setQi(i => i + 1); };

if (done) return (
<div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">
    <p className="text-emerald-800 font-bold text-lg">🎉 Completaste {score} de {data.questions.length}</p>
    <button onClick={onReset}
        className="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Reiniciar</button>
</div>
);

return (
<div>
    <p className="text-sm text-slate-500 mb-3">Pregunta {qi + 1} de {data.questions.length}</p>
    <div className="flex items-center gap-2 mb-4 flex-wrap">
        {q.sequence.map((s, i) => (
        <span key={i} className={`px-4 py-2 rounded-lg font-bold text-lg ${s==='?'

            picked === null ? 'bg-white border-slate-300 hover:border-indigo-400 cursor-pointer' :
            i === q.correct ? 'bg-emerald-100 border-emerald-400 text-emerald-800' :

            }`}>{opt}</button>
        ))}
    </div>
    {picked !== null && picked !== q.correct && <p className="text-rose-700 mb-2">Esa no es — intentá otra vez o mirá la
        pista.</p>}
    {picked === q.correct && <p className="text-emerald-700 mb-2 font-medium">¡Correcto! {q.hint}</p>}
    {!showHint && picked !== q.correct && <button onClick={()=> setShowHint(true)} className="text-sm text-indigo-600
        underline mb-2">Ver pista</button>}
    {showHint && <p className="text-sm text-indigo-700 italic mb-2">💡 {q.hint}</p>}
    {picked !== null && <button onClick={next}
        className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Siguiente →</button>}
</div>

const OrderStepsGame = ({ data, onReset }) => {
const [ei, setEi] = useState(0);
const [selected, setSelected] = useState([]);
const [shuffled] = useState(() => data.exercises.map(ex => [...ex.steps].sort(() => Math.random() - 0.5)));
const ex = data.exercises[ei];
const done = ei >= data.exercises.length;
const available = shuffled[ei] ? shuffled[ei].filter(s => !selected.includes(s)) : [];
const isCorrect = selected.length === ex?.steps.length && selected.every((s, i) => s === ex.steps[i]);
const isWrong = selected.length > 0 && selected.length === ex?.steps.length && !isCorrect;

const addStep = (step) => { setSelected(p => [...p, step]); };
const reset = () => { setSelected([]); };
const next = () => { setSelected([]); setEi(i => i + 1); };

if (done) return (
<div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">

const AssociationGame = ({ data, onReset }) => {
const [selectedLeft, setSelectedLeft] = useState(null);
const [matched, setMatched] = useState({});
const [wrong, setWrong] = useState(null);
const shuffledRight = useMemo(() => [...data.pairs.map(p => p[1])].sort(() => Math.random() - 0.5), []);
const allDone = Object.keys(matched).length === data.pairs.length;

const clickLeft = (concept) => { if (matched[concept]) return; setSelectedLeft(concept); setWrong(null); };
const clickRight = (def) => {
if (!selectedLeft || Object.values(matched).includes(def)) return;
const pair = data.pairs.find(p => p[0] === selectedLeft && p[1] === def);
if (pair) { setMatched(p => ({...p, [selectedLeft]: def})); setSelectedLeft(null); }
else { setWrong(def); setTimeout(() => setWrong(null), 800); }
};

return (
<div>
    <div className="grid grid-cols-2 gap-4">
        <div className="space-y-2">
            <p className="text-xs font-bold text-slate-500 mb-1">Conceptos</p>
            {data.pairs.map(([concept], i) => (
            <button key={i} onClick={()=> clickLeft(concept)} className={`w-full text-left p-3 rounded-xl border-2
                transition-all text-sm ${
                matched[concept] ? 'bg-emerald-100 border-emerald-300 text-emerald-700' :

const IntruderGame = ({ data, onReset }) => {
const [gi, setGi] = useState(0);
const [picked, setPicked] = useState(null);
const [score, setScore] = useState(0);
const g = data.groups[gi];
const done = gi >= data.groups.length;

const pick = (i) => { if (picked !== null) return; setPicked(i); if (i === g.intruder) setScore(s => s + 1); };
const next = () => { setPicked(null); setGi(i => i + 1); };

if (done) return (
<div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">
    <p className="text-emerald-800 font-bold text-lg">🎉 Encontraste {score} de {data.groups.length} intrusos</p>
    <button onClick={onReset}
        className="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Reiniciar</button>
</div>
);

return (
<div>
    <p className="text-sm text-slate-500 mb-3">Grupo {gi + 1} de {data.groups.length}</p>
    <div className="flex flex-wrap gap-3 mb-4">
        {g.items.map((item, i) => (
        <button key={i} onClick={()=> pick(i)} className={`px-4 py-3 rounded-xl border-2 font-medium transition-all ${
            picked === null ? 'bg-white border-slate-300 hover:border-indigo-400 cursor-pointer' :
            i === g.intruder ? 'bg-amber-100 border-amber-400 text-amber-800' :
            i === picked && i !== g.intruder ? 'bg-rose-100 border-rose-300 text-rose-700' :
            'bg-slate-50 border-slate-200'
            }`}>{item}</button>
        ))}
    </div>
    {picked !== null && picked === g.intruder && <p className="text-emerald-700 font-medium mb-2">¡Correcto! {g.reason}
    </p>}
    {picked !== null && picked !== g.intruder && <p className="text-rose-700 mb-2">No es ese. El intruso era:
        <strong>{g.items[g.intruder]}</strong>. {g.reason}</p>}
    {picked !== null && <button onClick={next}
        className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Siguiente →</button>}
</div>
);
};

const ChallengesSection = () => {

if (!challenge) return null;
const props = { data: challenge, onReset: doReset, key: resetKey };
switch (challenge.type) {
case 'memoryPairs': return <MemoryPairsGame {...props} />;
case 'sequence': return <SequenceGame {...props} />;
case 'spotDifference': return <SpotDifferenceGame {...props} />;
case 'orderSteps': return <OrderStepsGame {...props} />;
case 'association': return <AssociationGame {...props} />;
case 'intruder': return <IntruderGame {...props} />;
default: return null;
}

                            ))}
                        </ul>
                    </div>

                    <div className="bg-amber-50 rounded-xl p-5 border border-amber-200 mb-8">
                        <h4 className="font-bold text-amber-800 mb-2 flex items-center gap-2">
                            <Lightbulb className="w-4 h-4" /> Práctica sugerida
                        </h4>
                        <p className="text-amber-900">{mod.practice}</p>
                    </div>

                    <div className="flex items-center justify-between gap-4">
                        <button onClick={()=> setModuleIndex(i => Math.max(0, i - 1))} disabled={moduleIndex === 0}
                            className="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-100 text-slate-700
                            hover:bg-slate-200 disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                            <ChevronLeft className="w-4 h-4" /> Anterior
                        </button>
                        {moduleIndex < theoryModules.length - 1 ? ( <button onClick={()=> setModuleIndex(i => i + 1)}
                            className="flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 text-white
                            hover:bg-indigo-700 transition-all">
                            Siguiente
                            <ChevronRight className="w-4 h-4" />
                            </button>
                            ) : (
                            <button onClick={()=> setView('gym')}
                                className="flex items-center gap-2 px-5 py-2 rounded-lg bg-emerald-600 text-white
                                hover:bg-emerald-700 transition-all font-medium">
                                Continuar al Gimnasio
                                <ArrowUpRight className="w-4 h-4" />
                            </button>
                            )}
                    </div>
                </div>
            </div>
        </div>
        )}

        {/* GYM VIEW */}
        {view === 'gym' &&
        <PromptGym />}

        {/* IMAGES VIEW */}
        {view === 'images' &&
        <ImagesSection />}

        {/* SHEETS VIEW */}
        {view === 'sheets' &&
        <PlanillasSection />}

        {/* CHALLENGES VIEW */}
        {view === 'challenges' &&
        <ChallengesSection />}

        {/* STORIES VIEW */}
        {view === 'stories' && (
        activeStory ? <StoryPlayer story={activeStory} onBack={()=> setActiveStory(null)} /> : (
            <div>
                <div
                    className="bg-gradient-to-br from-purple-50 to-pink-50 rounded-2xl p-6 mb-6 border border-purple-200 max-w-3xl mx-auto">
                    <h3 className="text-xl font-bold text-purple-800 mb-2 flex items-center gap-2">
                        <MessageCircle className="w-5 h-5" /> Historias de uso
                    </h3>
                    <p className="text-purple-900">Casos reales que muestran cómo mejorar interacciones con IA, paso a
                        paso. Cada historia incluye un prompt reutilizable al final.</p>
                </div>
                <StoriesGallery onSelect={setActiveStory} />
            </div>
            )
            )}
    </main>

    <footer className="bg-white border-t border-slate-200 mt-12">
        <div className="max-w-5xl mx-auto px-4 py-6 text-center text-slate-500 text-sm">
            <p className="font-medium">Laboratorio de IA para tu desarrollo inmobiliario — Material formativo</p>
            <p className="mt-1">Navega las secciones a tu ritmo. Volvé cuando quieras.</p>
        </div>
    </footer>
</div>
);
};

createRoot(document.getElementById('root')).render(
<App />);
</script>
</body>

</html>

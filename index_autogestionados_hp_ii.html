                    'Una IA generativa no piensa como una persona ni "sabe" cosas como las sabe un periodista con años de oficio. Funciona prediciendo, a gran velocidad, qué texto (o qué imagen, audio o video) es el más probable a partir de patrones que aprendió de enormes volúmenes de información. Cuando le escribís un pedido, calcula la respuesta más plausible. Su fortaleza es combinar ideas, redactar y ordenar; su debilidad es la certeza de cada dato concreto.',
                    'Pensala como un asistente nuevo, muy rápido y muy leído, pero que recién entra a la redacción: puede redactarte el copete de una nota, armarte la escaleta de un programa o resumirte un comunicado en segundos, pero no conoce TU realidad hasta que se la contás. Cuanto mejor le expliques el contexto —de qué trata el medio, qué tema o fuente tenés entre manos, para qué programa y público es—, mejores y más útiles serán sus respuestas.',

                    'Para las fórmulas, la IA es una gran aliada. Le podés describir en palabras lo que querés y te da la fórmula lista: "necesito una fórmula que sume los montos solo cuando la sección sea Deportes". Te devuelve algo como SUMAR.SI (o SUMIF) y te explica cada parte. Pedile siempre que te explique la fórmula, no solo que te la dé: así aprendés y podés adaptarla.',

objective: `Saber cuánta pauta necesitás para cubrir tus costos.`, prompt: `Ayudame a entender y calcular el punto de equilibrio del medio: cuánta pauta necesito vender por mes para cubrir los costos fijos (sueldos, conectividad, derechos, alquiler) y los variables. Explicame el concepto con un ejemplo simple, decime qué datos necesito y cómo armarlo en una planilla. No inventes mis números: guiame para cargarlos.`, why: `Te da una brújula financiera para decidir tu ritmo de trabajo.` },
{ id: 'p26', level: 'profundizar', domain: `Contenidos y enlatados`, title: `Organizar la grilla de contenidos y enlatados`,
objective: `Tener contenido para toda la grilla sin repetir ni quedarte corto.`, prompt: `Actuá como jefe de contenidos. Ayudame a organizar el flujo de contenidos del medio: qué producción propia conviene sostener, qué enlatados de terceros usar y en qué franjas, cuándo renovar, control al recibir un envío y cómo evitar quedarte sin material o repetir. Para cada punto: qué controlar y un consejo práctico. Formato de tabla o checklist.`, why: `Ordena una parte que suele generar baches en la grilla.` },
{ id: 'p27', level: 'profundizar', domain: `Dispositivos digitales`, title: `Configurar respaldo en la nube`,
objective: `Proteger la información del medio.`, prompt: `Actuá como instructor digital paciente. Guiame paso a paso para configurar una copia de seguridad automática de mis planillas, audios y archivos en la nube. Explicame primero las opciones (Google Drive, OneDrive) con sus ventajas, y después el paso a paso de la que recomiendes para alguien con conocimientos intermedios.`, why: `Evita la catástrofe de perder los registros y los audios de las coberturas.` },
{ id: 'p28', level: 'profundizar', domain: `Producción de programas`, title: `Cuestionario para una entrevista exigente`,
objective: `Sacar el máximo de una entrevista importante.`, prompt: `Voy a entrevistar a [un funcionario / un especialista / un protagonista de un hecho]. Ayudame a preparar 10 preguntas inteligentes y ordenadas por tema (contexto, datos duros, contradicciones, repreguntas), de lo general a lo específico. No me des opiniones: solo ayudame a preguntar mejor para no quedarme sin lo importante.`, why: `Llegás preparado y evitás una entrevista que se diluye.` },
{ id: 'p29', level: 'profundizar', domain: `Seguridad de datos`, title: `Anonimizar la planilla de contactos`,
objective: `Analizar datos sin exponer información sensible.`, prompt: `Actuá como asesor de seguridad digital. Quiero que la IA me analice mi planilla de pauta y contactos, pero sin exponer datos de fuentes ni anunciantes. Explicame cómo reemplazar nombres, DNI y teléfonos por códigos genéricos manteniendo la utilidad del análisis, y dame un mini procedimiento para hacerlo rápido cada vez. Cuidá especialmente la identidad de fuentes reservadas.`, why: `Te permite usar la IA con tus datos cuidando a tus fuentes.` },
{ id: 'p30', level: 'profundizar', domain: `Comercialización`, title: `Guion para presentar una propuesta de pauta importante`,
objective: `Presentar un paquete de pauta a un anunciante grande.`, prompt: `Actuá como asesor comercial. Ayudame a preparar un guion breve para presentarle a un anunciante una propuesta de pauta importante (un paquete anual o un patrocinio de programa). Incluí: presentación de la propuesta, diferenciales (alcance provincial, programas, credibilidad), el detalle con [completar] y manejo de objeciones frecuentes (precio, retorno). Tono profesional y honesto.`, why: `Te da seguridad y estructura para cerrar acuerdos importantes.` },
{ id: 'p31', level: 'profundizar', domain: `Redes sociales`, title: `Calendario mensual de contenidos`,
objective: `Planear un mes entero de presencia.`, prompt: `Diseñame un calendario de contenidos para un mes (4 semanas) para el medio. Equilibrá tipos de publicación: adelanto de programa, tema del día con placa, entrevista destacada, dato útil o de servicio, y una acción de cercanía con la audiencia. Entregalo como tabla con columnas: semana, día, tipo, tema, imagen sugerida y texto breve.`, why: `Sostenés presencia sin improvisar cada día qué publicar.` },
{ id: 'p32', level: 'profundizar', domain: `Control y verificación`, title: `Protocolo de verificación por escrito`,
objective: `Documentar el proceso de chequeo para estandarizarlo.`, prompt: `Actuá como editor responsable de verificación. Ayudame a redactar un protocolo de verificación para que cualquiera en el equipo lo siga igual: qué se chequea antes de publicar (fuentes, datos, citas, contexto), cómo se documenta el chequeo y criterios para dar una nota por aprobada. Dejá [completar] donde van mis responsables y canales.`, why: `Estandariza el rigor y protege al medio de errores y desmentidos.` },
{ id: 'p33', level: 'profundizar', domain: `Organización del medio`, title: `Rutina semanal de gestión`,
objective: `Que la gestión no se acumule.`, prompt: `Ayudame a diseñar una rutina semanal de gestión para el medio, de 30 minutos por día: qué revisar cada día (programas en curso, pauta y contactos, contenidos y enlatados, redes, planificación). Formato de tabla por día con la tarea y su objetivo. Que sea realista para alguien que también está mucho al aire y en la producción.`, why: `Convierte la gestión en un hábito liviano y constante.` },

// ─── NIVEL PROYECTAR ───
{ id: 'p34', level: 'proyectar', domain: `Plan del medio`, title: `Plan comercial del medio`,
objective: `Diseñar la estrategia comercial completa del medio.`, prompt: `Actuá como consultor de medios. Ayudame a diseñar el plan comercial del medio por fases: 1) diagnóstico (programas, audiencia, qué nos diferencia), 2) objetivos de pauta, 3) tarifas y paquetes, 4) difusión y canales, 5) seguimiento. Para cada fase: acciones, entregables y un indicador para saber si voy bien.`, why: `Te da una hoja de ruta integral, no acciones sueltas.` },
{ id: 'p35', level: 'proyectar', domain: `Imágenes para difusión`, title: `Identidad visual del medio`,
objective: `Definir el estilo gráfico de todo el material.`, prompt: `Actuá como director de arte y diseñador de marca. Ayudame a definir, por fases, la identidad visual del medio: 1) valores y personalidad editorial, 2) paleta de colores y tipo de imágenes, 3) cómo se vería un logo simple, 4) cómo aplicarla en placas, portadas de programas y redes. Para cada fase dame opciones y un prompt de imagen para explorarla.`, why: `Unifica todo tu material bajo una imagen coherente y memorable.` },
{ id: 'p36', level: 'proyectar', domain: `Plan del medio`, title: `Plan para sumar un formato o programa nuevo`,
objective: `Lanzar algo nuevo con orden.`, prompt: `Actuá como consultor de medios. Quiero sumar un formato o una línea nueva (por ejemplo, un noticiero provincial, un pódcast, un newsletter o un canal de streaming). Diseñá un plan por fases: qué necesito (equipo, contenidos, recursos), cómo conseguir la primera audiencia, qué riesgos cuidar y un primer paso muy concreto y barato para este mes.`, why: `Convierte una idea grande en pasos manejables y accionables.` },
{ id: 'p37', level: 'proyectar', domain: `Planilla de cálculo`, title: `Tablero de control del medio`,
objective: `Tener todos los indicadores en una vista.`, prompt: `Ayudame a diseñar, por etapas, un tablero de control (dashboard) simple en planilla para el medio: programas del mes, pauta por anunciante, minutos al aire por programa, costos vs. lo previsto y caja. Indicame qué hojas y tablas dinámicas necesito, cómo conectar los datos y cómo armar 3 o 4 gráficos clave. Empezá por la estructura y avanzá paso a paso.`, why: `Te da una sala de comando para decidir con datos de un vistazo.` },
{ id: 'p38', level: 'proyectar', domain: `Pensamiento estratégico`, title: `Escenarios para el próximo año del medio`,
objective: `Anticipar y prepararte para distintos futuros.`, prompt: `Actuá como analista de escenarios. Ayudame a proyectar tres escenarios para el próximo año del medio (optimista, realista, adverso) según variables como la pauta oficial y privada, los costos y la competencia digital. Para cada escenario: qué supone, qué oportunidad y qué riesgo trae, y qué prepararía desde ahora. Cerrá con decisiones que sirven en los tres casos.`, why: `Te prepara para lo que venga en vez de reaccionar tarde.` },
{ id: 'p39', level: 'proyectar', domain: `Plan del medio`, title: `Evaluar una oportunidad nueva con criterio`,
objective: `Analizar una oportunidad con criterio.`, prompt: `Actuá como consultor de medios. Ayudame a evaluar, por fases, una oportunidad nueva (sumar una radio a la cadena, un acuerdo con un portal, una corresponsalía en otra localidad). Para cada fase: qué averiguar (audiencia, costos, competencia, riesgos), qué números estimar y qué cuidar. Priorizá los pasos según costo e información disponible. No inventes datos: marcá qué verificar.`, why: `Te ordena una decisión grande antes de comprometer recursos.` },
{ id: 'p40', level: 'proyectar', domain: `Organización del medio`, title: `Sistema personal de trabajo con IA`,
objective: `Integrar la IA a tu rutina de forma estable.`, prompt: `Ayudame a diseñar mi sistema personal para trabajar con IA en el medio: qué tareas le delego (redacción y guiones, planillas, placas, búsqueda e investigación, organización), qué prompts guardo como plantillas, cuándo verifico y cómo mido si me está ahorrando tiempo. Entregalo por fases, con un set inicial de 5 plantillas de prompt para mis tareas más frecuentes.`, why: `Hace que la IA se vuelva parte estable de tu forma de trabajar.` },

// ─── NIVEL INICIO (continuación) ───
{ id: 'p41', level: 'inicio', domain: `Contenido de valor para la audiencia`, title: `Guía simple sobre un tema de servicio`,
objective: `Dar valor a tu audiencia con contenido útil.`, prompt: `Actuá como periodista de servicio. Armame una guía simple de 6 puntos sobre un tema útil para la audiencia (por ejemplo, cómo hacer un trámite provincial, cómo prevenir una estafa, qué hacer ante una alerta meteorológica). Tono claro y honesto, con fuentes oficiales a citar. Para emitir al aire o publicar como contenido de valor.`, why: `El contenido útil fideliza audiencia y posiciona la seriedad del medio.` },
{ id: 'p42', level: 'inicio', domain: `Coberturas y eventos`, title: `Checklist para cubrir un evento o acto`,
objective: `No olvidarte nada el día de la cobertura.`, prompt: `Actuá como jefe de coberturas. Armame una checklist para cubrir un evento o acto (un acto oficial, una elección, un evento deportivo): acreditación, equipos (grabador, celular, batería, conectividad), contactos a buscar, preguntas, material de archivo y envío del material. Formato de lista verificable por bloques (antes, durante, después).`, why: `Llegás a la cobertura preparado y das una imagen profesional.` },
{ id: 'p43', level: 'inicio', domain: `Gestión del tiempo`, title: `Organizar la semana entre aire, producción y vida`,
objective: `Equilibrar el trabajo y el tiempo personal.`, prompt: `Actuá como asesor de productividad. Ayudame a organizar una semana tipo que combine salir al aire, producción y edición, gestión (planilla, contactos, pauta) y mi tiempo personal (familia, descanso). Dame una grilla por día con bloques de tiempo realistas para alguien con muchos frentes abiertos que no quiere vivir pegado al trabajo.`, why: `Evita que la gestión se coma el tiempo personal.` },
{ id: 'p44', level: 'inicio', domain: `Identidad e imagen del medio`, title: `Qué información debe llevar una placa institucional`,
objective: `Armar una placa clara y reconocible.`, prompt: `Actuá como diseñador de comunicación. Decime qué información debería incluir una placa institucional del medio (nombre, frecuencias o dónde sintonizar, redes, una frase identitaria) y cómo jerarquizarla para que se lea de un vistazo en pantalla. Marcá qué datos conviene verificar antes de publicar.`, why: `Una placa clara y completa transmite seriedad y refuerza la marca.` },
{ id: 'p45', level: 'inicio', domain: `Atención al oyente y anunciante`, title: `Mensaje de agradecimiento a una fuente o invitado`,
objective: `Cuidar el vínculo después de una nota.`, prompt: `Redactá un mensaje breve y cálido para enviarle a una fuente o invitado después de una entrevista: agradecimiento, mención de cuándo y dónde sale al aire o publicada, y disponibilidad para futuras notas. Dame dos versiones, una más corta y una un poco más completa.`, why: `El buen trato convierte a una fuente en un contacto que vuelve.` },
{ id: 'p46', level: 'inicio', domain: `Redes sociales`, title: `Pie de foto para una publicación`,
objective: `Acompañar una imagen con buen texto.`, prompt: `Escribime tres opciones de pie de foto para una publicación con una imagen de una cobertura o un programa. Tono cercano y confiable, con un emoji o dos como mucho, una frase que cuente algo de la nota o un dato y un cierre que invite a escuchar o leer. Máximo 3 líneas cada uno.`, why: `Una buena imagen rinde más con un texto que conecte.` },
{ id: 'p47', level: 'inicio', domain: `Marketing y difusión`, title: `Acción para impulsar la audiencia`,
objective: `Aprovechar un momento para sumar audiencia.`, prompt: `Proponme 3 ideas de acciones para impulsar la audiencia de un programa (por ejemplo: una participación al aire, un sorteo con un anunciante, una cobertura especial). Para cada una: en qué consiste, a qué público apunta y un texto breve para anunciarla. Que sean realistas y honestas. No inventes números de audiencia.`, why: `Una acción concreta puede mover la audiencia y la pauta.` },
{ id: 'p48', level: 'inicio', domain: `Planilla de cálculo`, title: `Calcular tarifas con un margen parejo`,
objective: `Fijar tarifas de pauta sin errores.`, prompt: `Tengo el costo de cada espacio o programa y quiero fijar la tarifa con un margen parejo. Dame la fórmula para hacerlo en una planilla y armá una tablita de ejemplo con [completar] en los valores. Mostrame también cómo aplicar un margen distinto según la franja horaria. Google Sheets.`, why: `Evita errores al fijar la tarifa de cada espacio.` },
{ id: 'p49', level: 'inicio', domain: `Dispositivos digitales`, title: `Organizar las grabaciones y audios`,
objective: `Encontrar tus audios cuando los necesitás.`, prompt: `Actuá como instructor digital paciente. Enseñame paso a paso a organizar mis grabaciones y audios en carpetas (por tema, fecha o programa) y a encontrarlos rápido después. Dame los pasos para [Android / iPhone] y un criterio simple para nombrar los archivos.`, why: `Tener los audios ordenados te ahorra tiempo y respalda tu trabajo.` },
{ id: 'p50', level: 'inicio', domain: `Relación con la audiencia`, title: `Base de contactos y fuentes`,
objective: `Empezar a cuidar tus fuentes y contactos clave.`, prompt: `Ayudame a armar una lista simple de fuentes y contactos en una planilla: qué columnas conviene tener para recordar quién es cada uno, su área o tema, cómo contactarlo y el estado del vínculo, sin guardar datos sensibles de más ni exponer fuentes reservadas. Después decime una idea concreta para mantener el contacto sin ser invasivo.`, why: `Una agenda ordenada de fuentes vale tanto como una buena primicia.` },

// ─── NIVEL PROFUNDIZAR (continuación) ───
{ id: 'p51', level: 'profundizar', domain: `Contenido de valor para la audiencia`, title: `Mini guía de servicio como contenido`,
objective: `Crear un material de valor que sume audiencia.`, prompt: `Actuá como periodista de servicio. Ayudame a armar una mini guía útil (para aire, redes o newsletter), por ejemplo "cómo reclamar por un servicio público" o "calendario de vencimientos provinciales": qué mirar, errores comunes, datos oficiales a citar. Tono honesto y útil. Sugerí cómo presentarla con la marca del medio.`, why: `Un contenido propio de servicio posiciona al medio como referente.` },
{ id: 'p52', level: 'profundizar', domain: `Coberturas y eventos`, title: `Plan para una cobertura especial`,
objective: `Sacar el máximo provecho de una cobertura importante.`, prompt: `Actuá como editor de coberturas especiales. Ayudame a planificar una cobertura grande (una elección, un temporal, un evento provincial): objetivos, qué recursos necesito (móviles, corresponsales, enlaces, archivo), cómo coordinar a la cadena de radios, cómo verificar en tiempo real y qué hacer después con el material. Dame un plan por etapas (antes, durante, después).`, why: `Una cobertura bien planificada marca la diferencia frente a la competencia.` },
{ id: 'p53', level: 'profundizar', domain: `Formación del equipo`, title: `Guía para que un colaborador produzca como vos`,
objective: `Poder delegar la producción sin perder calidad.`, prompt: `Actuá como formador de equipos periodísticos. Ayudame a escribir una guía breve para que un colaborador pueda producir un programa o una nota con mi criterio: cómo elegir y jerarquizar temas, cómo chequear, estructura de la escaleta, tono del medio, y qué hacer ante dudas o un tema sensible. Formato claro, con [completar] en los datos del medio.`, why: `Te permite delegar producción y crecer sin perder el nivel.` },
{ id: 'p54', level: 'profundizar', domain: `Identidad e imagen del medio`, title: `Comparar formas de presentar el medio`,
objective: `Decidir cómo presentar el medio para más valor.`, prompt: `Actuá como diseñador de comunicación. Ayudame a comparar 3 formas de presentar el medio con más valor percibido (un media kit simple, un sitio web con la grilla y los programas, un newsletter con lo mejor de la semana). Para cada una: costo aproximado, percepción del público y del anunciante, para qué sirve y esfuerzo. Cerrá con una recomendación según mi momento.`, why: `La presentación influye directo en la audiencia y los anunciantes que atraés.` },
{ id: 'p55', level: 'profundizar', domain: `Finanzas y costos`, title: `Rentabilidad por fuente de ingreso`,
objective: `Saber qué fuente de ingreso te deja más resultado.`, prompt: `Ayudame a comparar la rentabilidad de mis fuentes de ingreso (pauta privada, pauta oficial, patrocinios de programa, producción para terceros). Decime qué datos necesito de cada una (ingreso, costo asociado, comisión) y cómo armar una planilla que muestre el resultado real de cada una. No inventes cifras: guiame para cargarlas.`, why: `Te dice dónde conviene poner la energía comercial.` },
{ id: 'p56', level: 'profundizar', domain: `Planilla de cálculo`, title: `Control de gastos vs. presupuesto con alertas`,
objective: `Saber cuándo un gasto se está pasando.`, prompt: `Ayudame a armar en una planilla un control que compare lo gastado por rubro (sueldos, enlatados y derechos, conectividad, impuestos) contra lo presupuestado y me avise cuando un rubro supera un umbral. Indicame las columnas, la fórmula con SI para marcar "desvío" y cómo usar formato condicional para que se pinte en rojo. Google Sheets.`, why: `Detectás los desvíos a tiempo, no cuando ya es tarde.` },
{ id: 'p57', level: 'profundizar', domain: `Comercialización`, title: `Propuesta para un acuerdo con un anunciante o aliado`,
objective: `Abrir o ampliar un acuerdo comercial.`, prompt: `Actuá como asesor comercial. Ayudame a preparar una propuesta para un acuerdo con un anunciante grande o un aliado (un municipio, una cámara comercial, una empresa provincial): qué ofrecés (pauta, menciones, coberturas), material que les vas a dar, condiciones y contraprestación, y reglas claras. Incluí un cierre que proponga empezar con una prueba. Dejá [completar] en lo numérico.`, why: `Un buen acuerdo amplía mucho tu sostenibilidad.` },
{ id: 'p58', level: 'profundizar', domain: `Marketing y difusión`, title: `Encuesta corta para conocer a la audiencia`,
objective: `Escuchar a tu audiencia con método.`, prompt: `Ayudame a diseñar una encuesta breve (máximo 6 preguntas) para tu audiencia: qué programas escucha, en qué horario, qué temas le interesan, por qué medio te sigue. Mezclá preguntas de opción y una abierta. Dame también un mensaje corto y amable para invitarlos a responderla.`, why: `Las mejoras de la programación salen de entender qué quiere la audiencia.` },
{ id: 'p59', level: 'profundizar', domain: `Comunicar credibilidad`, title: `Comunicar la seriedad del medio con honestidad`,
objective: `Mostrar la credibilidad del medio sin exagerar.`, prompt: `Actuá como asesor de comunicación. Ayudame a comunicar lo que hace serio al medio (verificación de datos, cobertura propia en toda la provincia, trayectoria, pluralidad de voces) sin caer en exageraciones ni autobombo. Pedime primero qué incluyo y después ayudame a redactar 3 mensajes honestos y concretos.`, why: `La credibilidad bien comunicada suma; mal comunicada, resta.` },
{ id: 'p60', level: 'profundizar', domain: `Atención al oyente y anunciante`, title: `Protocolo de respuesta en 24 horas`,
objective: `Que ninguna consulta quede sin responder.`, prompt: `Ayudame a definir un protocolo simple para responder consultas en menos de 24 horas: cómo registrar las que entran (web, redes, mensajes, teléfono), mensajes tipo para los casos más comunes (cómo anunciar, cómo enviar una gacetilla, una consulta de un oyente) y qué hacer cuando no puedo resolver al instante. Formato de mini procedimiento.`, why: `La rapidez de respuesta cuida el vínculo con oyentes y anunciantes.` },

// ─── NIVEL PROYECTAR (continuación) ───
{ id: 'p61', level: 'proyectar', domain: `Plan del medio`, title: `Plan de marca para el medio`,
objective: `Dar coherencia a toda tu comunicación.`, prompt: `Actuá como consultor de marca de medios. Ayudame a armar, por fases, un plan de marca para el medio: identidad y mensaje central, calendario de momentos clave (coberturas especiales, aniversarios, temporada), líneas de contenido y objetivos por trimestre. Para cada fase: acciones, entregables y un indicador de avance.`, why: `Te da una hoja de ruta de marca en vez de acciones improvisadas.` },
{ id: 'p62', level: 'proyectar', domain: `Plan del medio`, title: `Apuntar a una audiencia nueva`,
objective: `Sumar un público que hoy no te escucha.`, prompt: `Actuá como consultor de medios. Quiero atraer una audiencia nueva (por ejemplo, público joven en digital, o localidades de la línea sur donde casi no llego). Diseñá un plan por fases: qué necesito (formatos, plataformas, contenidos), cómo llegar a ese público, qué riesgos cuidar y un primer paso concreto y barato para probar. Dejá [completar] en lo numérico.`, why: `Convierte la ambición de crecer en pasos manejables.` },
{ id: 'p63', level: 'proyectar', domain: `Pensamiento estratégico`, title: `Diversificación de la propuesta`,
objective: `Explorar nuevas líneas para el medio.`, prompt: `Actuá como analista estratégico. Ayudame a evaluar opciones para diversificar el medio (pódcast, streaming de video, newsletter, producción de contenido para terceros, eventos). Para cada una: audiencia potencial, esfuerzo, inversión y riesgo. Ordenalas en una matriz esfuerzo/impacto y recomendá por dónde empezar.`, why: `Diversificar bien reduce tu dependencia de una sola fuente de ingreso.` },
{ id: 'p64', level: 'proyectar', domain: `Plan del medio`, title: `Sistema de producción de punta a punta`,
objective: `Ordenar el flujo completo de una nota o programa.`, prompt: `Actuá como consultor de medios. Ayudame a diseñar, por fases, un sistema simple para gestionar una nota o programa de punta a punta: idea, asignación, chequeo, producción, emisión y archivo. Indicá qué parte conviene llevar en planilla y dame un primer paso para implementarlo este mes.`, why: `Un flujo ordenado evita olvidos, baches al aire y errores.` },
{ id: 'p65', level: 'proyectar', domain: `Relación con la comunidad`, title: `Vínculo con la comunidad provincial`,
objective: `Fortalecer el rol del medio en la comunidad.`, prompt: `Actuá como gestor de vínculos con la comunidad. Ayudame a diseñar, por fases, cómo fortalecer el rol del medio en la comunidad (presencia en localidades, campañas de bien público, espacios para voces locales, alianzas con instituciones). Incluí objetivos, acciones simples y un primer paso.`, why: `Un medio cercano a su comunidad gana reputación y audiencia fiel.` },
{ id: 'p66', level: 'proyectar', domain: `Organización del medio`, title: `Manual de procesos del medio`,
objective: `Poner por escrito cómo funciona la operación.`, prompt: `Ayudame a armar, por fases, un manual de procesos simple del medio: captación y verificación, producción, emisión, comercialización y administración. Para cada proceso: pasos, responsable y registros. Empecemos por listar los procesos y después desarrollamos uno por vez.`, why: `Un medio documentado es más fácil de delegar, mejorar y sostener.` },
{ id: 'p67', level: 'proyectar', domain: `Plan del medio`, title: `Campaña para reactivar la pauta en temporada baja`,

const resolveBadPrompt = (item) => {
const domainKey = item.domain.toLowerCase();
if (weakPromptByDomain[domainKey]) return weakPromptByDomain[domainKey];
if (item.level === 'inicio') return `Necesito ayuda con ${item.domain.toLowerCase()} para
${item.objective.toLowerCase()}.`;
if (item.level === 'profundizar') return `Trabaja este tema: ${item.title}. Dame una versión útil para hoy.`;
return `Resuelve completo este proyecto: ${item.title}.`;
};

const resolveWhyBad = (item) => {
if (item.level === 'inicio') return `Es específico en tema, pero no define público, formato de salida ni criterios para
evaluar si la respuesta sirve.`;
if (item.level === 'profundizar') return `Pide una tarea exigente, pero no fija alcance, límites ni método de revisión.

return `Intenta resolver un proyecto complejo de una sola vez, sin fases ni entregables intermedios. Eso aumenta errores

};

if (domain.includes('proyecto') || domain.includes('estratégico') || domain.includes('iniciativa') ||

if (domain.includes('matemáticas') || domain.includes('lógica')) return `precisión del razonamiento, claridad de cada

if (domain.includes('seguridad') || domain.includes('trámites')) return `pasos verificables, canales oficiales

if (domain.includes('precio') || domain.includes('finanzas') || domain.includes('costo') || domain.includes('planilla') || domain.includes('registro')) return `exactitud de los cálculos, claridad de las fórmulas y verificabilidad de cada número`;
if (domain.includes('imágen') || domain.includes('imagen') || domain.includes('marketing') || domain.includes('difusión') || domain.includes('redes') || domain.includes('cartelería')) return `claridad del estilo, coherencia de marca, honestidad del mensaje y formato listo para usar`;
if (domain.includes('obra') || domain.includes('cronograma') || domain.includes('control') || domain.includes('calidad') || domain.includes('sustentable')) return `pasos verificables, criterios de control claros y respeto del criterio profesional`;
if (domain.includes('cliente') || domain.includes('comprador') || domain.includes('comercial') || domain.includes('logística') || domain.includes('proveedor') || domain.includes('material') || domain.includes('evento') || domain.includes('entorno')) return `tono adecuado, propuesta accionable y reducción de ambigüedad`;
return `claridad, utilidad práctica, control de supuestos y siguiente paso concreto`;

const resolveToneFrame = (item, role, outputFormat, qualityCriteria, techniques) => {
if (item.level === 'inicio') {
return [
`Actúa como ${role} con tono cercano, claro y paciente.`,
``, `Meta de esta sesión: ${item.objective}`,
`Pedido base: ${item.prompt}`,
``, `Trabajemos paso a paso:`,
`- Si falta contexto, hazme primero 2 o 3 preguntas breves de calibración.`,
`- Evita tecnicismos innecesarios y usa ejemplos concretos.`,
`- Formato de salida solicitado: ${outputFormat}`,
`- Cierra con una mini revisión de calidad (criterios: ${qualityCriteria}).`,
``, `Antes de cerrar, sugiere una versión 2 de este pedido para mejorar precisión sin complejizar de más.`,
`Técnicas aplicadas: ${techniques.join(', ')}.`
];
}
if (item.level === 'profundizar') {
return [
`Actúa como ${role} con enfoque riguroso y criterio crítico.`,
``, `Objetivo de trabajo: ${item.objective}`,
`Consigna inicial: ${item.prompt}`,
``, `Condiciones metodológicas:`,
`1) Si hay ambigüedad, abre con preguntas de calibración antes de producir la versión final.`,
`2) Entrega una propuesta estructurada, con supuestos explícitos y justificación breve por bloque.`,
`3) Respeta este formato de salida: ${outputFormat}`,
`4) Incluye control de calidad al final con estos criterios: ${qualityCriteria}.`,
`5) Señala qué conviene iterar en una segunda ronda y por qué.`,
``, `Técnicas aplicadas en este prompt: ${techniques.join(', ')}.`
];
}
return [
`Actúa como ${role} con enfoque estratégico y orientación a ejecución.`,
``, `Resultado buscado: ${item.objective}`,
`Desafío base: ${item.prompt}`,
``, `Diseña la respuesta como un plan por fases:`,
`Fase 1 - Delimitación: supuestos, alcance y preguntas críticas de calibración.`,
`Fase 2 - Diseño: propuesta principal en formato solicitado (${outputFormat}).`,
`Fase 3 - Implementación: hitos, entregables y métricas de avance.`,
`Fase 4 - Control: riesgos, límites y revisión final con criterios (${qualityCriteria}).`,
``, `Cierre obligatorio: incluye una versión 2 del pedido para iterar con mayor precisión y menor riesgo.`,
`Técnicas aplicadas: ${techniques.join(', ')}.`
];
};

const buildEnhancedPrompt = (item) => {
const techniques = levelTechniqueMap[item.level] || levelTechniqueMap.inicio;
const role = resolveRole(item.domain);
const outputFormat = resolveOutputFormat(item);
const qualityCriteria = resolveQualityCriteria(item);
const frame = resolveToneFrame(item, role, outputFormat, qualityCriteria, techniques);
return frame.join('\n');
};

const enrichedPromptItems = promptItems.map((item) => ({
...item,
badPrompt: resolveBadPrompt(item),
badReason: resolveWhyBad(item),
techniques: levelTechniqueMap[item.level] || levelTechniqueMap.inicio,
enhancedPrompt: buildEnhancedPrompt(item)
}));

{ term: `Iluminación`, def: `La luz de la escena: cálida, fría, suave, dura, natural, de estudio. Cambia por completo la sensación de la foto.` },
{ term: `Paleta de colores`, def: `Los colores predominantes. Mantener una paleta fija ayuda a que tu marca se vea coherente en todo el material.` },
{ term: `Relación de aspecto`, def: `La forma del rectángulo: cuadrada (1:1) para redes, vertical (4:5 o 9:16) para historias o placas, horizontal (16:9) para portadas.` },
{ term: `Resolución`, def: `El tamaño y la nitidez de la imagen. Para pantalla alcanza poco; para imprimir necesitás imágenes grandes y nítidas (alta resolución).` },
{ term: `Imagen de referencia`, def: `Una foto o captura que subís para que la IA la use como punto de partida o inspiración. Clave para editar lo que ya tenés (una foto de una cobertura, una placa, una imagen previa).` },
{ term: `Edición / variación`, def: `Pedirle a la IA que modifique una imagen existente (cambiar fondo, luz, agregar o quitar algo) en vez de crear una desde cero.` },

const MemoryPairsGame = ({ data, onReset }) => {
const [cards, setCards] = useState(() => {
return data.pairs.flatMap((pair, i) => [
{ id: i * 2, pairId: i, text: pair[0] },
{ id: i * 2 + 1, pairId: i, text: pair[1] }
]).sort(() => Math.random() - 0.5);
});
const [revealed, setRevealed] = useState([]);
const [matched, setMatched] = useState([]);
const [moves, setMoves] = useState(0);
const [checking, setChecking] = useState(false);

const handleFlip = (cardId) => {
if (checking || revealed.includes(cardId) || matched.includes(cardId)) return;
const newRevealed = [...revealed, cardId];
setRevealed(newRevealed);
if (newRevealed.length === 2) {
setMoves(m => m + 1);
setChecking(true);
const c1 = cards.find(c => c.id === newRevealed[0]);
const c2 = cards.find(c => c.id === newRevealed[1]);
if (c1.pairId === c2.pairId) {
setTimeout(() => { setMatched(p => [...p, c1.id, c2.id]); setRevealed([]); setChecking(false); }, 700);
} else {
setTimeout(() => { setRevealed([]); setChecking(false); }, 1200);
}
}
};

const allDone = matched.length === cards.length;

return (
<div>
    <div className="grid grid-cols-3 md:grid-cols-4 gap-3 mb-4">
        {cards.map(card => {
        const isUp = revealed.includes(card.id) || matched.includes(card.id);
        const isDone = matched.includes(card.id);
        return (

setPicked(i);
if (i === q.correct) setScore(s => s + 1);

const next = () => { setPicked(null); setShowHint(false); setQi(i => i + 1); };

<div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">

return (

const OrderStepsGame = ({ data, onReset }) => {
const [ei, setEi] = useState(0);
const [selected, setSelected] = useState([]);
const [shuffled] = useState(() => data.exercises.map(ex => [...ex.steps].sort(() => Math.random() - 0.5)));
const ex = data.exercises[ei];
const done = ei >= data.exercises.length;
const available = shuffled[ei] ? shuffled[ei].filter(s => !selected.includes(s)) : [];
const isCorrect = selected.length === ex?.steps.length && selected.every((s, i) => s === ex.steps[i]);
const isWrong = selected.length > 0 && selected.length === ex?.steps.length && !isCorrect;

const addStep = (step) => { setSelected(p => [...p, step]); };
const reset = () => { setSelected([]); };
const next = () => { setSelected([]); setEi(i => i + 1); };

if (done) return (
<div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">

</div>
);

        ))}

        {available.map((s, i) => (

        ))}

    {isWrong && <p className="text-rose-700 mb-3">No exactamente. Intentalo de nuevo.</p>}

</div>
);
};

const AssociationGame = ({ data, onReset }) => {
const [selectedLeft, setSelectedLeft] = useState(null);
const [matched, setMatched] = useState({});
const [wrong, setWrong] = useState(null);
const shuffledRight = useMemo(() => [...data.pairs.map(p => p[1])].sort(() => Math.random() - 0.5), []);
const allDone = Object.keys(matched).length === data.pairs.length;

const clickLeft = (concept) => { if (matched[concept]) return; setSelectedLeft(concept); setWrong(null); };
const clickRight = (def) => {
if (!selectedLeft || Object.values(matched).includes(def)) return;
const pair = data.pairs.find(p => p[0] === selectedLeft && p[1] === def);
if (pair) { setMatched(p => ({...p, [selectedLeft]: def})); setSelectedLeft(null); }
else { setWrong(def); setTimeout(() => setWrong(null), 800); }
};

return (
<div>
    <div className="grid grid-cols-2 gap-4">
        <div className="space-y-2">
            <p className="text-xs font-bold text-slate-500 mb-1">Conceptos</p>
            {data.pairs.map(([concept], i) => (
            <button key={i} onClick={()=> clickLeft(concept)} className={`w-full text-left p-3 rounded-xl border-2
                transition-all text-sm ${
                matched[concept] ? 'bg-emerald-100 border-emerald-300 text-emerald-700' :
                selectedLeft === concept ? 'bg-indigo-100 border-indigo-400 text-indigo-800 ring-2 ring-indigo-300' :
                'bg-white border-slate-300 hover:border-indigo-400 cursor-pointer'
                }`}>{concept}</button>
            ))}
        </div>
        <div className="space-y-2">
            <p className="text-xs font-bold text-slate-500 mb-1">Definiciones</p>
            {shuffledRight.map((def, i) => (
            <button key={i} onClick={()=> clickRight(def)} className={`w-full text-left p-3 rounded-xl border-2
                transition-all text-sm ${
                Object.values(matched).includes(def) ? 'bg-emerald-100 border-emerald-300 text-emerald-700' :
                wrong === def ? 'bg-rose-100 border-rose-400' :
                'bg-white border-slate-300 hover:border-indigo-400 cursor-pointer'
                }`}>{def}</button>
            ))}
        </div>
    </div>
    {allDone && (
    <div className="mt-4 text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">
        <p className="text-emerald-800 font-bold text-lg">🎉 ¡Todas las asociaciones correctas!</p>
        <button onClick={onReset}
            className="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Jugar de nuevo</button>
    </div>

        {data.pairs.length}</p>}
</div>
);
};

<div className="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50">
    {/* Header */}
    <header className="sticky top-0 z-50 bg-white/90 backdrop-blur-lg border-b border-slate-200 shadow-sm">
        <div className="max-w-5xl mx-auto px-4 py-3">
            <div className="flex items-center gap-3 mb-3">
                <div
                    className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-md">
                    <BrainCircuit className="w-6 h-6 text-white" />
                </div>
                <div>
                    <h1 className="text-lg font-extrabold text-slate-800 leading-tight">Laboratorio de IA para tu trabajo</h1>
                    <p className="text-xs text-slate-500">Periodismo y producción de medios · Río Negro</p>
                </div>
            </div>
            <div className="flex gap-1 overflow-x-auto">
                {tabs.map(tab => (
                <button key={tab.id} onClick={()=> { setView(tab.id); setActiveStory(null); }}
                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap
                    transition-all ${
                    view === tab.id ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'
                    }`}>
                    {tab.icon} {tab.label}
                </button>
                ))}
            </div>
        </div>
    </header>

    <main className="max-w-5xl mx-auto px-4 py-8">
        {/* THEORY VIEW */}
        {view === 'theory' && (
        <div className="flex flex-col md:flex-row gap-6">
            {/* Sidebar - desktop */}
            <aside className="hidden md:block md:w-64 flex-shrink-0">
                <div className="sticky top-32 space-y-1">
                    <p className="text-xs font-bold text-slate-400 uppercase mb-2">Módulos ({theoryModules.length})</p>
                    {theoryModules.map((m, i) => (
                    <button key={m.id} onClick={()=> setModuleIndex(i)}
                        className={`w-full text-left px-3 py-2 rounded-lg text-sm transition-all ${
                        i === moduleIndex ? 'bg-indigo-100 text-indigo-800 font-bold border-l-4 border-indigo-500' :
                        'text-slate-600 hover:bg-slate-100'
                        }`}>
                        <span className="text-xs text-slate-400 mr-1">{i + 1}.</span> {m.title}
                    </button>
                    ))}
                </div>
            </aside>

            {/* Sidebar - mobile dropdown */}
            <div className="md:hidden mb-4">
                <select value={moduleIndex} onChange={e=> setModuleIndex(Number(e.target.value))}
                    className="w-full p-3 rounded-xl border-2 border-slate-300 bg-white text-slate-800 font-medium">
                    {theoryModules.map((m, i) => <option key={m.id} value={i}>{i + 1}. {m.title}</option>)}
                </select>
            </div>

            {/* Content */}
            <div className="flex-1 max-w-3xl">
                <div className="bg-white rounded-2xl shadow-md border border-slate-200 p-6 md:p-8">
                    <p className="text-xs text-indigo-600 font-bold uppercase mb-1">Módulo {moduleIndex + 1} de
                        {theoryModules.length}</p>
                    <h2 className="text-2xl font-extrabold text-slate-800 mb-1">{mod.title}</h2>
                    <p className="text-slate-500 mb-6">{mod.subtitle}</p>

                    <div className="space-y-4 text-slate-700 leading-relaxed mb-8">
                        {mod.reading.map((para, i) => <p key={i}>{para}</p>)}
                    </div>

                    <div className="bg-indigo-50 rounded-xl p-5 border border-indigo-200 mb-6">
                        <h4 className="font-bold text-indigo-800 mb-3 flex items-center gap-2">
                            <CheckCircle2 className="w-4 h-4" /> Checklist
                        </h4>
                        <ul className="space-y-2">
                            {mod.checklist.map((item, i) => (
                            <li key={i} className="flex items-start gap-2 text-indigo-900">
                                <CheckCircle2 className="w-4 h-4 text-indigo-500 mt-1 flex-shrink-0" />
                                <span>{item}</span>
                            </li>
                            ))}
                        </ul>
                    </div>

                    <div className="bg-amber-50 rounded-xl p-5 border border-amber-200 mb-8">
                        <h4 className="font-bold text-amber-800 mb-2 flex items-center gap-2">
                            <Lightbulb className="w-4 h-4" /> Práctica sugerida
                        </h4>
                        <p className="text-amber-900">{mod.practice}</p>
                    </div>

                    <div className="flex items-center justify-between gap-4">
                        <button onClick={()=> setModuleIndex(i => Math.max(0, i - 1))} disabled={moduleIndex === 0}
                            className="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-100 text-slate-700
                            hover:bg-slate-200 disabled:opacity-30 disabled:cursor-not-allowed transition-all">
                            <ChevronLeft className="w-4 h-4" /> Anterior
                        </button>
                        {moduleIndex < theoryModules.length - 1 ? ( <button onClick={()=> setModuleIndex(i => i + 1)}
                            className="flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 text-white
                            hover:bg-indigo-700 transition-all">
                            Siguiente
                            <ChevronRight className="w-4 h-4" />
                            </button>
                            ) : (
                            <button onClick={()=> setView('gym')}
                                className="flex items-center gap-2 px-5 py-2 rounded-lg bg-emerald-600 text-white
                                hover:bg-emerald-700 transition-all font-medium">
                                Continuar al Gimnasio
                                <ArrowUpRight className="w-4 h-4" />
                            </button>
                            )}
                    </div>
                </div>
            </div>
        </div>
        )}

        {/* GYM VIEW */}
        {view === 'gym' &&
        <PromptGym />}

        {/* IMAGES VIEW */}
        {view === 'images' &&
        <ImagesSection />}

        {/* SHEETS VIEW */}
        {view === 'sheets' &&
        <PlanillasSection />}

        {/* AUDIO Y VIDEO VIEW */}
        {view === 'audio' &&
        <AudioVideoSection />}

        {/* INVESTIGADOR VIEW */}
        {view === 'investigador' &&
        <InvestigadorSection />}

        {/* NOTEBOOKLM VIEW */}
        {view === 'notebooklm' &&
        <NotebookLMSection />}

        {/* CHALLENGES VIEW */}
        {view === 'challenges' &&
        <ChallengesSection />}

        {/* STORIES VIEW */}
        {view === 'stories' && (
        activeStory ? <StoryPlayer story={activeStory} onBack={()=> setActiveStory(null)} /> : (
            <div>
                <div
                    className="bg-gradient-to-br from-purple-50 to-pink-50 rounded-2xl p-6 mb-6 border border-purple-200 max-w-3xl mx-auto">
                    <h3 className="text-xl font-bold text-purple-800 mb-2 flex items-center gap-2">
                        <MessageCircle className="w-5 h-5" /> Historias de uso
                    </h3>
                    <p className="text-purple-900">Casos reales que muestran cómo mejorar interacciones con IA, paso a
                        paso. Cada historia incluye un prompt reutilizable al final.</p>
                </div>
                <StoriesGallery onSelect={setActiveStory} />
            </div>
            )
            )}
    </main>

    <footer className="bg-white border-t border-slate-200 mt-12">
        <div className="max-w-5xl mx-auto px-4 py-6 text-center text-slate-500 text-sm">
            <p className="font-medium">Laboratorio de IA para periodismo y producción de medios — Material formativo</p>
            <p className="mt-1">Navega las secciones a tu ritmo. Volvé cuando quieras.</p>
        </div>
    </footer>
</div>
);
};

createRoot(document.getElementById('root')).render(
<App />);
</script>
</body>

</html>

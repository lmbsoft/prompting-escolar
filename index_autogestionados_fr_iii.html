{ id: 'p8', level: 'inicio', domain: `Registro comercial`, title: `Diseño de la hoja de ventas`,
objective: `Definir qué registrar de cada venta.`, prompt: `Ayudame a diseñar la hoja "Ventas" de mi planilla de registro para una empresa de nueces y avellanas. Decime qué columnas debería tener y por qué cada una es útil para analizar después. Pensá en producto, cantidad, precio, cliente, canal y fecha.`, why: `Empezás a registrar bien desde el inicio, sin lamentar datos faltantes.` },
{ id: 'p9', level: 'inicio', domain: `Atención al cliente`, title: `Mensaje de WhatsApp para confirmar un pedido`,
objective: `Comunicarte con claridad y buen tono.`, prompt: `Redactá un mensaje breve de WhatsApp para confirmarle a un cliente su pedido. Debe incluir: saludo, resumen del pedido [completar], total [completar], forma de entrega y un cierre amable. Dame dos versiones: una más formal y una más cercana.`, why: `Profesionaliza tu comunicación cotidiana con clientes.` },
{ id: 'p10', level: 'inicio', domain: `Bienestar y ocio`, title: `Rutina de entrenamiento para la semana`,
objective: `Organizar tu actividad física combinando gimnasia y natación.`, prompt: `Actúa como coach de vida activa. Armame una rutina semanal que combine gimnasia y natación, incluyendo natación en aguas frías con precauciones de seguridad. Tengo nivel intermedio. Indicá días, duración y un objetivo por sesión. Sin reemplazar consejo médico.`, why: `Ordena tu tiempo libre y cuida tu energía para el trabajo.` },
{ id: 'p11', level: 'inicio', domain: `Calendario de temporada`, title: `Cuenta regresiva para la cosecha`,
objective: `Preparar con anticipación la campaña.`, prompt: `Faltan [X semanas] para la cosecha de nueces. Armame una cuenta regresiva con las tareas a preparar cada semana: equipos, personal, secado, envases, comunicación a clientes. Formato de checklist por semana.`, why: `Llegás a la cosecha organizado y sin improvisar.` },
{ id: 'p12', level: 'inicio', domain: `Imágenes para difusión`, title: `Tu primer prompt de foto de producto`,
objective: `Generar una imagen atractiva de tu producto.`, prompt: `Actúa como director de arte de fotografía de alimentos. Dame un prompt detallado, en español, para generar una foto realista de un cuenco de nueces y avellanas sobre una mesa de madera rústica, con luz natural cálida, fondo desenfocado y estilo apetecible para redes. Explicame por qué cada detalle del prompt importa.`, why: `Aprendés a describir una imagen para que la IA la genere bien.` },
{ id: 'p13', level: 'inicio', domain: `Aprendizaje con IA`, title: `Plan para aprender IA en 4 semanas`,
objective: `Avanzar con método y sin dispersarte.`, prompt: `Diseñame un plan de 4 semanas para aprender a usar IA en mi empresa de frutos secos, con sesiones de 30 minutos, 4 días por semana. Cada semana con un foco (textos, planillas, imágenes, organización) y un resultado concreto al final. Cerrá cada semana con una mini meta.`, why: `Transforma el entusiasmo en una práctica sostenida.` },
{ id: 'p14', level: 'inicio', domain: `Proveedores y compras`, title: `Comparar opciones de un insumo`,
objective: `Decidir una compra con criterios claros.`, prompt: `Necesito comparar tres opciones para comprar [insumo: envases / etiquetas / bolsas]. Armá una tabla con criterios: costo unitario, calidad, plazo de entrega, mínimo de compra y proveedor. Después dame una recomendación según si priorizo precio, calidad o rapidez.`, why: `Te ayuda a decidir con datos ordenados en vez de a ojo.` },
{ id: 'p15', level: 'inicio', domain: `Organización del negocio`, title: `Ordenar las tareas del día`,
objective: `Empezar el día con foco.`, prompt: `Ayudame a ordenar mis tareas del día en mi empresa de nueces y avellanas. Te paso una lista desordenada [pegar lista] y quiero que la organices por prioridad e indiques cuáles puedo delegar o hacer con ayuda de IA. Formato: lista numerada con una nota breve por tarea.`, why: `Convierte una lista caótica en un plan claro de jornada.` },
{ id: 'p16', level: 'inicio', domain: `Redes sociales`, title: `Texto para presentar tu emprendimiento`,
objective: `Contar quién sos y qué ofrecés.`, prompt: `Escribime un texto de presentación (estilo "acerca de") para la página de mi emprendimiento de nueces y avellanas de la zona del IDEVI, Viedma. Tono cálido y honesto, que transmita producción regional y cuidado artesanal. Máximo 6 líneas. Dame dos versiones.`, why: `Te da una carta de presentación lista para tus perfiles.` },
{ id: 'p17', level: 'inicio', domain: `Finanzas y costos`, title: `Entender el costo de un producto`,
objective: `Saber cuánto te cuesta producir para fijar precio.`, prompt: `Ayudame a listar todos los costos que debería considerar para calcular el costo de un kilo de nueces peladas (producción, secado, pelado, envase, mano de obra, mermas). Hacé una lista ordenada por categoría. No inventes montos: dejá [completar] en cada ítem para que yo cargue.`, why: `Te da el esqueleto para calcular costos reales y fijar precios con criterio.` },
{ id: 'p18', level: 'inicio', domain: `Poscosecha y calidad`, title: `Checklist de control de calidad`,
objective: `Estandarizar la calidad del producto que sale.`, prompt: `Actúa como especialista en poscosecha de frutos secos. Armame una checklist de control de calidad para nueces antes del envasado: humedad, color, sabor, sanidad, calibre y descarte. Formato de lista verificable con qué observar en cada punto.`, why: `Un producto parejo se vende mejor y genera confianza.` },

// ─── NIVEL PROFUNDIZAR ───
{ id: 'p19', level: 'profundizar', domain: `Lista de precios`, title: `Lista de precios con descuentos por volumen`,
objective: `Diseñar una política de precios escalonada.`, prompt: `Ayudame a estructurar una lista de precios con descuentos por volumen para mayoristas. Quiero tramos (por ejemplo 1-9 kg, 10-49 kg, 50+ kg). Armá la tabla con la lógica de los tramos y dejá los valores como [completar]. Sugerí buenas prácticas para que los descuentos no me coman el margen.`, why: `Ordena tu estrategia comercial y protege tu rentabilidad.` },
{ id: 'p20', level: 'profundizar', domain: `Planilla de cálculo`, title: `Modelo de margen por producto`,
objective: `Calcular automáticamente la ganancia de cada producto.`, prompt: `Ayudame a armar en una planilla un modelo donde, ingresando costo y precio de venta de cada producto, calcule automáticamente el margen en pesos y en porcentaje. Indicame qué columnas crear, qué fórmulas poner en cada una y cómo verificar que el cálculo está bien. Excel y Google Sheets.`, why: `Ves de un vistazo qué producto te deja más rentabilidad.` },
{ id: 'p21', level: 'profundizar', domain: `Marketing y difusión`, title: `Campaña de difusión para la temporada`,
objective: `Planificar varias semanas de comunicación.`, prompt: `Actúa como redactor publicitario de productos regionales. Diseñame una campaña de difusión de 3 semanas para la temporada de cosecha de nueces. Incluí objetivo, mensaje central, calendario de publicaciones, y para cada semana 3 ideas de contenido con su foto sugerida. Tono honesto, sin promesas exageradas.`, why: `Pasás de publicar suelto a una campaña con hilo conductor.` },
{ id: 'p22', level: 'profundizar', domain: `Registro comercial`, title: `Libro de registro completo del negocio`,
objective: `Diseñar tu sistema de registro integral.`, prompt: `Ayudame a diseñar un libro de registro en planilla para mi empresa, con hojas conectadas: Ventas, Clientes, Productos/Precios y Gastos. Para cada hoja, decime las columnas y cómo se relacionan entre sí (por ejemplo, traer el precio desde Productos a Ventas con BUSCARX). Explicá el porqué de cada decisión.`, why: `Te da una base de gestión profesional que crece con el negocio.` },
{ id: 'p23', level: 'profundizar', domain: `Imágenes para difusión`, title: `Brief para una serie de fotos coherentes`,
objective: `Lograr varias imágenes con un mismo estilo de marca.`, prompt: `Actúa como director de arte. Quiero generar una serie de 5 fotos de producto con un estilo coherente para mi marca de frutos secos (rústico, cálido, natural). Dame un "brief" de estilo (paleta, luz, fondo, encuadre) y luego 5 prompts, uno por foto, que respeten ese estilo. Explicá cómo mantener la coherencia entre todas.`, why: `Aprendés a construir una identidad visual, no fotos sueltas.` },
{ id: 'p24', level: 'profundizar', domain: `Atención al cliente`, title: `Manual de respuestas para situaciones difíciles`,
objective: `Manejar reclamos y casos delicados con buen criterio.`, prompt: `Ayudame a redactar respuestas para 5 situaciones difíciles con clientes: demora en la entrega, producto que no conformó, pedido de descuento excesivo, consulta fuera de horario y reclamo por error de pesaje. Para cada una: una respuesta empática, firme y orientada a solución.`, why: `Te prepara para resolver con profesionalismo los momentos tensos.` },
{ id: 'p25', level: 'profundizar', domain: `Finanzas y costos`, title: `Punto de equilibrio de la temporada`,
objective: `Saber cuánto necesitás vender para cubrir costos.`, prompt: `Ayudame a entender y calcular el punto de equilibrio de mi temporada: cuántos kilos necesito vender para cubrir mis costos fijos y variables. Explicame el concepto con un ejemplo simple, decime qué datos necesito y cómo armarlo en una planilla. No inventes mis números: guiame para cargarlos.`, why: `Te da una brújula financiera para tomar decisiones de campaña.` },
{ id: 'p26', level: 'profundizar', domain: `Logística y envíos`, title: `Organizar envíos y costos de entrega`,
objective: `Definir cómo y a qué precio entregás.`, prompt: `Actúa como coordinador de logística para pequeñas empresas. Ayudame a organizar mis opciones de envío de frutos secos (retiro, envío local en Viedma, envío a otras ciudades). Para cada una: cómo funciona, qué cuidar con un producto alimenticio y cómo calcular el costo a cobrar. Formato de tabla comparativa.`, why: `Ordena una parte que suele generar desorden y pérdidas.` },
{ id: 'p27', level: 'profundizar', domain: `Dispositivos digitales`, title: `Configurar respaldo en la nube`,
objective: `Proteger tu información de trabajo.`, prompt: `Actúa como instructor digital paciente. Guiame paso a paso para configurar una copia de seguridad automática de mis planillas y fotos del negocio en la nube. Explicame primero las opciones (Google Drive, OneDrive) con sus ventajas, y después el paso a paso de la que recomiendes para alguien con conocimientos intermedios.`, why: `Evita la catástrofe de perder los registros del negocio.` },
{ id: 'p28', level: 'profundizar', domain: `Producción agropecuaria`, title: `Preguntas inteligentes para el agrónomo`,
objective: `Aprovechar al máximo la visita del profesional.`, prompt: `Voy a reunirme con el agrónomo por mi monte de nogales y avellanos. Ayudame a preparar 10 preguntas inteligentes y ordenadas por tema (sanidad, riego, nutrición, poda, cosecha) para aprovechar la consulta. No me des recomendaciones agronómicas: solo ayudame a preguntar mejor.`, why: `Llegás preparado y sacás más valor de cada asesoramiento.` },
{ id: 'p29', level: 'profundizar', domain: `Seguridad de datos`, title: `Anonimizar la planilla de clientes`,
objective: `Analizar datos sin exponer información sensible.`, prompt: `Actúa como asesor de seguridad digital. Quiero que la IA me analice mi planilla de ventas, pero sin exponer datos de clientes. Explicame cómo reemplazar nombres, teléfonos y direcciones por códigos genéricos manteniendo la utilidad del análisis, y dame un mini procedimiento para hacerlo rápido cada vez.`, why: `Te permite usar la IA con tus datos cuidando a tus clientes.` },
{ id: 'p30', level: 'profundizar', domain: `Comercialización`, title: `Guion para vender a un nuevo mayorista`,
objective: `Presentar tu producto a un cliente grande.`, prompt: `Actúa como asesor comercial. Ayudame a preparar un guion breve para ofrecerle mis nueces y avellanas a un nuevo cliente mayorista (dietética, almacén, distribuidor). Incluí: presentación, diferenciales del producto regional, propuesta de precios y manejo de objeciones frecuentes. Tono profesional y honesto.`, why: `Te da seguridad y estructura para abrir cuentas importantes.` },
{ id: 'p31', level: 'profundizar', domain: `Redes sociales`, title: `Calendario mensual de contenidos`,
objective: `Planear un mes entero de presencia.`, prompt: `Diseñame un calendario de contenidos para un mes (4 semanas) para mi emprendimiento de frutos secos. Equilibrá tipos de publicación: producto, receta, proceso de campo, testimonio y promoción. Entregalo como tabla con columnas: semana, día, tipo, tema, foto sugerida y texto breve.`, why: `Sostenés presencia sin improvisar cada día qué publicar.` },
{ id: 'p32', level: 'profundizar', domain: `Poscosecha y calidad`, title: `Protocolo de secado por escrito`,
objective: `Documentar un proceso clave para estandarizarlo.`, prompt: `Actúa como especialista en poscosecha de frutos secos. Ayudame a redactar un protocolo de secado de nueces paso a paso para que cualquiera en mi equipo lo siga igual: recepción, condiciones de secado, controles, tiempos y criterios para dar por terminado. Dejá [completar] donde van mis valores específicos.`, why: `Estandariza la calidad y facilita delegar el proceso.` },
{ id: 'p33', level: 'profundizar', domain: `Organización del negocio`, title: `Rutina semanal de gestión`,
objective: `Que la gestión no se acumule.`, prompt: `Ayudame a diseñar una rutina semanal de gestión para mi empresa, de 30 minutos por día: qué revisar cada día (registros, pedidos, redes, planilla, planificación). Formato de tabla por día con la tarea y su objetivo. Que sea realista para alguien que también trabaja en el campo.`, why: `Convierte la gestión en un hábito liviano y constante.` },

// ─── NIVEL PROYECTAR ───
{ id: 'p34', level: 'proyectar', domain: `Plan de proyecto`, title: `Plan de comercialización de la temporada`,
objective: `Diseñar la estrategia comercial completa del año.`, prompt: `Actúa como consultor de proyectos para pymes agropecuarias. Ayudame a diseñar el plan de comercialización de mi temporada de nueces y avellanas por fases: 1) diagnóstico (productos, capacidad, clientes), 2) objetivos de venta, 3) canales y precios, 4) difusión, 5) seguimiento. Para cada fase: acciones, entregables y un indicador para saber si voy bien.`, why: `Te da una hoja de ruta integral, no acciones sueltas.` },
{ id: 'p35', level: 'proyectar', domain: `Imágenes para difusión`, title: `Identidad visual de la marca`,
objective: `Definir el estilo gráfico de todo tu material.`, prompt: `Actúa como director de arte y diseñador de marca. Ayudame a definir, por fases, la identidad visual de mi marca de frutos secos regionales: 1) valores y personalidad, 2) paleta de colores y tipo de imágenes, 3) cómo se vería un logo simple, 4) cómo aplicarla en folletos, etiquetas y redes. Para cada fase dame opciones y un prompt de imagen para explorarla.`, why: `Unifica todo tu material bajo una imagen coherente y memorable.` },
{ id: 'p36', level: 'proyectar', domain: `Plan de proyecto`, title: `Plan para abrir un canal de venta online`,
objective: `Llevar tu venta a internet de forma ordenada.`, prompt: `Actúa como consultor de proyectos. Quiero empezar a vender mis frutos secos por internet (catálogo + pedidos por WhatsApp o tienda simple). Diseñá un plan por fases: qué necesito, cómo armar el catálogo con fotos y precios, cómo gestionar pedidos y envíos, y qué riesgos cuidar. Incluí hitos y un primer paso muy concreto para esta semana.`, why: `Convierte una idea grande en pasos manejables y accionables.` },
{ id: 'p37', level: 'proyectar', domain: `Planilla de cálculo`, title: `Tablero de control del negocio`,
objective: `Tener todos los indicadores en una vista.`, prompt: `Ayudame a diseñar, por etapas, un tablero de control (dashboard) simple en planilla para mi empresa: ventas por mes, por producto, margen, clientes top y gastos. Indicame qué hojas y tablas dinámicas necesito, cómo conectar los datos y cómo armar 3 o 4 gráficos clave. Empezá por la estructura y avanzá paso a paso.`, why: `Te da una sala de comando para decidir con datos de un vistazo.` },
{ id: 'p38', level: 'proyectar', domain: `Pensamiento estratégico`, title: `Escenarios para la próxima temporada`,
objective: `Anticipar y prepararte para distintos futuros.`, prompt: `Actúa como analista de escenarios. Ayudame a proyectar tres escenarios para mi próxima temporada (optimista, realista, adverso) según variables como rinde, precio y demanda. Para cada escenario: qué supone, qué oportunidad y qué riesgo trae, y qué prepararía desde ahora. Cerrá con decisiones que sirven en los tres casos.`, why: `Te prepara para lo que venga en vez de reaccionar tarde.` },
{ id: 'p39', level: 'proyectar', domain: `Plan de proyecto`, title: `Proyecto de valor agregado al producto`,
objective: `Explorar productos derivados o diferenciados.`, prompt: `Actúa como consultor de innovación para pymes de alimentos. Ayudame a evaluar, por fases, ideas de valor agregado para mis nueces y avellanas (por ejemplo: tostadas y saborizadas, mix de frutos secos, packaging premium, regalos empresariales). Para cada idea: qué requiere, a qué cliente apunta, ventajas y riesgos. Priorizá según esfuerzo e impacto.`, why: `Abre caminos de crecimiento más allá de vender a granel.` },
{ id: 'p40', level: 'proyectar', domain: `Organización del negocio`, title: `Sistema personal de trabajo con IA`,
objective: `Integrar la IA a tu rutina de forma estable.`, prompt: `Ayudame a diseñar mi sistema personal para trabajar con IA en el negocio: qué tareas le delego (textos, planillas, imágenes, organización), qué prompts guardo como plantillas, cuándo verifico y cómo mido si me está ahorrando tiempo. Entregalo por fases, con un set inicial de 5 plantillas de prompt para mis tareas más frecuentes.`, why: `Hace que la IA se vuelva parte estable de tu forma de trabajar.` },

// ─── NIVEL INICIO (continuación) ───
{ id: 'p41', level: 'inicio', domain: `Recetas y usos`, title: `Ideas de recetas con frutos secos`,
objective: `Dar valor a tus clientes con usos del producto.`, prompt: `Actuá como chef y desarrollador de recetas. Dame 6 ideas simples de recetas que usen nueces o avellanas (dulces y saladas), pensadas para compartir con mis clientes. Para cada una: nombre, ingredientes principales y un paso clave. Que sean fáciles y caseras.`, why: `El contenido útil acerca clientes y posiciona tu producto.` },
{ id: 'p42', level: 'inicio', domain: `Ferias y eventos`, title: `Checklist para un puesto en una feria`,
objective: `No olvidarte nada el día del evento.`, prompt: `Actuá como organizador de presencia en ferias. Armame una checklist para montar un puesto de venta de nueces y avellanas en una feria regional: producto, presentación, cartelería, dinero/cobro, muestras y atención. Formato de lista verificable por bloques.`, why: `Llegás a la feria preparado y das una imagen profesional.` },
{ id: 'p43', level: 'inicio', domain: `Gestión del tiempo`, title: `Organizar la semana entre campo y gestión`,
objective: `Equilibrar el trabajo productivo y el administrativo.`, prompt: `Actuá como asesor de productividad. Ayudame a organizar una semana tipo que combine tareas de campo, atención a clientes, gestión (planilla, pedidos) y un rato de aprendizaje de IA. Dame una grilla por día con bloques de tiempo realistas para alguien que también produce.`, why: `Evita que la gestión quede siempre para "después".` },
{ id: 'p44', level: 'inicio', domain: `Packaging y etiquetas`, title: `Qué información debe llevar una etiqueta`,
objective: `Armar una etiqueta clara y correcta.`, prompt: `Actuá como diseñador de packaging para alimentos. Decime qué información debería incluir la etiqueta de mis bolsas de nueces y avellanas (nombre, peso, origen, contacto, conservación, etc.) y cómo ordenarla. Marcá qué datos conviene verificar con normativa antes de imprimir.`, why: `Una etiqueta completa transmite seriedad y cuida lo legal.` },
{ id: 'p45', level: 'inicio', domain: `Atención al cliente`, title: `Mensaje de posventa y agradecimiento`,
objective: `Cuidar el vínculo después de la venta.`, prompt: `Redactá un mensaje breve y cálido para enviarle a un cliente después de su compra: agradecimiento, una sugerencia de conservación del producto y una invitación amable a volver. Dame dos versiones, una más corta y una un poco más completa.`, why: `El cuidado posventa convierte una compra en un cliente que vuelve.` },
{ id: 'p46', level: 'inicio', domain: `Redes sociales`, title: `Pie de foto para una publicación`,
objective: `Acompañar una imagen con buen texto.`, prompt: `Escribime tres opciones de pie de foto para una publicación de mis nueces recién cosechadas. Tono cercano y regional, con un emoji o dos como mucho, una frase que cuente algo del producto y un cierre que invite a consultar. Máximo 3 líneas cada uno.`, why: `Una buena foto rinde más con un texto que conecte.` },
{ id: 'p47', level: 'inicio', domain: `Marketing y difusión`, title: `Promoción para una fecha especial`,
objective: `Aprovechar fechas para impulsar ventas.`, prompt: `Proponme 3 ideas de promoción de mis frutos secos para [fecha: Día de la Madre / Fin de año / etc.]. Para cada una: en qué consiste, a qué cliente apunta y un texto breve para anunciarla. Que sean realistas para un emprendimiento chico.`, why: `Las fechas clave son oportunidades concretas de venta.` },
{ id: 'p48', level: 'inicio', domain: `Planilla de cálculo`, title: `Convertir precios entre presentaciones`,
objective: `Calcular precios de distintas presentaciones sin errores.`, prompt: `Tengo el precio por kilo de mis productos y necesito calcular el precio de bolsas de 250 g, 500 g y 1 kg. Dame la fórmula para hacerlo en una planilla y armá una tablita de ejemplo con [completar] en los valores. Excel y Google Sheets.`, why: `Evita errores al fijar precios de distintos envases.` },
{ id: 'p49', level: 'inicio', domain: `Dispositivos digitales`, title: `Organizar las fotos del producto`,
objective: `Encontrar tus fotos cuando las necesitás.`, prompt: `Actuá como instructor digital paciente. Enseñame paso a paso a organizar las fotos de mis productos en álbumes en el celular y a encontrarlas rápido después. Dame los pasos para [Android / iPhone] y un criterio simple para nombrar los álbumes.`, why: `Tener las fotos ordenadas te ahorra tiempo cada vez que publicás.` },
{ id: 'p50', level: 'inicio', domain: `Fidelización de clientes`, title: `Lista de clientes frecuentes`,
objective: `Empezar a cuidar a quienes más te compran.`, prompt: `Ayudame a armar una lista simple de clientes frecuentes en una planilla: qué columnas conviene tener para recordar quién es cada uno, qué compra y cuándo, sin guardar datos sensibles de más. Después decime una idea concreta para premiar su fidelidad.`, why: `Es más barato cuidar a un cliente que conseguir uno nuevo.` },

// ─── NIVEL PROFUNDIZAR (continuación) ───
{ id: 'p51', level: 'profundizar', domain: `Recetas y usos`, title: `Mini recetario como gancho de marketing`,
objective: `Crear un material de valor que atraiga clientes.`, prompt: `Actuá como chef y desarrollador de recetas. Ayudame a armar un mini recetario de 5 recetas con nueces y avellanas para entregar (digital o impreso) como regalo a clientes. Para cada receta: título atractivo, ingredientes, pasos y una nota que conecte con mi producto. Sugerí cómo presentarlo.`, why: `Un recetario propio fideliza y difunde tu marca.` },
{ id: 'p52', level: 'profundizar', domain: `Ferias y eventos`, title: `Plan para participar en una feria regional`,
objective: `Sacar el máximo provecho de un evento.`, prompt: `Actuá como organizador de presencia en ferias. Ayudame a planificar la participación en una feria de productores: objetivos (vender, contactos, marca), qué llevar, cómo presentar el puesto, cómo captar datos de interesados y qué hacer después del evento. Dame un plan por etapas (antes, durante, después).`, why: `Una feria bien aprovechada deja ventas y contactos para meses.` },
{ id: 'p53', level: 'profundizar', domain: `Capacitación del equipo`, title: `Guía para que un ayudante atienda ventas`,

const resolveBadPrompt = (item) => {

${item.objective.toLowerCase()}.`;

return `Resuelve completo este proyecto: ${item.title}.`;
};

const resolveWhyBad = (item) => {
if (item.level === 'inicio') return `Es específico en tema, pero no define público, formato de salida ni criterios para
evaluar si la respuesta sirve.`;
if (item.level === 'profundizar') return `Pide una tarea exigente, pero no fija alcance, límites ni método de revisión.
La salida puede quedar correcta en apariencia y floja en calidad.`;
return `Intenta resolver un proyecto complejo de una sola vez, sin fases ni entregables intermedios. Eso aumenta errores
y reduce control de autoría.`;
};

const resolveQualityCriteria = (item) => {
const domain = item.domain.toLowerCase();
if (domain.includes('escritura') || domain.includes('editorial') || domain.includes('memorias') ||
domain.includes('legado')) return `coherencia argumental, voz propia, transiciones y cierre con sentido`;
if (domain.includes('docencia') || domain.includes('curso') || domain.includes('aprendizaje') ||
domain.includes('transferencia')) return `claridad didáctica, secuencia progresiva, actividad aplicable y evidencia de
comprensión`;
if (domain.includes('investigación') || domain.includes('fuentes') || domain.includes('ciencia')) return `trazabilidad
de fuentes, distinción entre verificado/pendiente y riesgos de error`;
if (domain.includes('multimedia') || domain.includes('video') || domain.includes('storyboard')) return `coherencia visual,
claridad del mensaje, control de textos exactos y factibilidad de producción`;
if (domain.includes('evaluación estratégica')) return `criterios explícitos, supuestos visibles, riesgos concretos y
primer experimento verificable`;
if (domain.includes('comunicación') || domain.includes('entrevista') || domain.includes('familiar')) return `tono
adecuado, intención explícita, reducción de ambigüedad y salida accionable`;
if (domain.includes('proyecto') || domain.includes('estratégico') || domain.includes('iniciativa') ||
domain.includes('impacto')) return `fases realistas, hitos verificables, riesgos y plan de mitigación`;
if (domain.includes('matemáticas') || domain.includes('lógica')) return `precisión del razonamiento, claridad de cada
paso y verificabilidad del resultado`;
if (domain.includes('salud') || domain.includes('bienestar')) return `límites claros entre autocuidado y consulta
profesional, lenguaje no alarmista`;
if (domain.includes('seguridad') || domain.includes('trámites')) return `pasos verificables, canales oficiales
identificados y alertas de riesgo`;
if (domain.includes('precio') || domain.includes('finanzas') || domain.includes('costo') || domain.includes('planilla') || domain.includes('registro')) return `exactitud de los cálculos, claridad de las fórmulas y verificabilidad de cada número`;
if (domain.includes('imágen') || domain.includes('imagen') || domain.includes('marketing') || domain.includes('difusión') || domain.includes('redes')) return `claridad del estilo, coherencia de marca, honestidad del mensaje y formato listo para usar`;
if (domain.includes('producción') || domain.includes('poscosecha') || domain.includes('calidad') || domain.includes('temporada')) return `pasos verificables, criterios de control claros y respeto del criterio profesional`;
if (domain.includes('cliente') || domain.includes('comercial') || domain.includes('logística') || domain.includes('proveedor')) return `tono adecuado, propuesta accionable y reducción de ambigüedad`;
return `claridad, utilidad práctica, control de supuestos y siguiente paso concreto`;
};

const resolveToneFrame = (item, role, outputFormat, qualityCriteria, techniques) => {
if (item.level === 'inicio') {
return [
`Actúa como ${role} con tono cercano, claro y paciente.`,
``, `Meta de esta sesión: ${item.objective}`,
`Pedido base: ${item.prompt}`,
``, `Trabajemos paso a paso:`,
`- Si falta contexto, hazme primero 2 o 3 preguntas breves de calibración.`,
`- Evita tecnicismos innecesarios y usa ejemplos concretos.`,
`- Formato de salida solicitado: ${outputFormat}`,
`- Cierra con una mini revisión de calidad (criterios: ${qualityCriteria}).`,
``, `Antes de cerrar, sugiere una versión 2 de este pedido para mejorar precisión sin complejizar de más.`,
`Técnicas aplicadas: ${techniques.join(', ')}.`
];
}
if (item.level === 'profundizar') {
return [
`Actúa como ${role} con enfoque riguroso y criterio crítico.`,
``, `Objetivo de trabajo: ${item.objective}`,
`Consigna inicial: ${item.prompt}`,
``, `Condiciones metodológicas:`,
`1) Si hay ambigüedad, abre con preguntas de calibración antes de producir la versión final.`,
`2) Entrega una propuesta estructurada, con supuestos explícitos y justificación breve por bloque.`,
`3) Respeta este formato de salida: ${outputFormat}`,
`4) Incluye control de calidad al final con estos criterios: ${qualityCriteria}.`,
`5) Señala qué conviene iterar en una segunda ronda y por qué.`,
``, `Técnicas aplicadas en este prompt: ${techniques.join(', ')}.`
];
}
return [
`Actúa como ${role} con enfoque estratégico y orientación a ejecución.`,
``, `Resultado buscado: ${item.objective}`,
`Desafío base: ${item.prompt}`,
``, `Diseña la respuesta como un plan por fases:`,
`Fase 1 - Delimitación: supuestos, alcance y preguntas críticas de calibración.`,
`Fase 2 - Diseño: propuesta principal en formato solicitado (${outputFormat}).`,
`Fase 3 - Implementación: hitos, entregables y métricas de avance.`,
`Fase 4 - Control: riesgos, límites y revisión final con criterios (${qualityCriteria}).`,
``, `Cierre obligatorio: incluye una versión 2 del pedido para iterar con mayor precisión y menor riesgo.`,
`Técnicas aplicadas: ${techniques.join(', ')}.`
];
};

const buildEnhancedPrompt = (item) => {
const techniques = levelTechniqueMap[item.level] || levelTechniqueMap.inicio;
const role = resolveRole(item.domain);
const outputFormat = resolveOutputFormat(item);
const qualityCriteria = resolveQualityCriteria(item);
const frame = resolveToneFrame(item, role, outputFormat, qualityCriteria, techniques);
return frame.join('\n');
};

const enrichedPromptItems = promptItems.map((item) => ({
...item,
badPrompt: resolveBadPrompt(item),
badReason: resolveWhyBad(item),
techniques: levelTechniqueMap[item.level] || levelTechniqueMap.inicio,
enhancedPrompt: buildEnhancedPrompt(item)
}));

{ term: `Paleta de colores`, def: `Los colores predominantes. Mantener una paleta fija ayuda a que tu marca se vea coherente en todo el material.` },

{ term: `Coherencia de marca`, def: `Que tus piezas se reconozcan como parte del mismo negocio: mismos tonos, luz, estilo, tipo de fondo y forma de presentar el producto.` }

const MemoryPairsGame = ({ data, onReset }) => {
const [cards, setCards] = useState(() => {
return data.pairs.flatMap((pair, i) => [
{ id: i * 2, pairId: i, text: pair[0] },
{ id: i * 2 + 1, pairId: i, text: pair[1] }
]).sort(() => Math.random() - 0.5);
});
const [revealed, setRevealed] = useState([]);
const [matched, setMatched] = useState([]);
const [moves, setMoves] = useState(0);
const [checking, setChecking] = useState(false);

const handleFlip = (cardId) => {
if (checking || revealed.includes(cardId) || matched.includes(cardId)) return;
const newRevealed = [...revealed, cardId];
setRevealed(newRevealed);
if (newRevealed.length === 2) {
setMoves(m => m + 1);
setChecking(true);
const c1 = cards.find(c => c.id === newRevealed[0]);
const c2 = cards.find(c => c.id === newRevealed[1]);
if (c1.pairId === c2.pairId) {
setTimeout(() => { setMatched(p => [...p, c1.id, c2.id]); setRevealed([]); setChecking(false); }, 700);
} else {
setTimeout(() => { setRevealed([]); setChecking(false); }, 1200);
}
}
};

const allDone = matched.length === cards.length;

return (
<div>
    <div className="grid grid-cols-3 md:grid-cols-4 gap-3 mb-4">
        {cards.map(card => {
        const isUp = revealed.includes(card.id) || matched.includes(card.id);
        const isDone = matched.includes(card.id);
        return (
        <button key={card.id} onClick={()=> handleFlip(card.id)}
            className={`p-3 rounded-xl border-2 min-h-[72px] text-center transition-all duration-300 font-medium ${
            isDone ? 'bg-emerald-100 border-emerald-400 text-emerald-800' :
            isUp ? 'bg-indigo-100 border-indigo-400 text-indigo-800' :
            'bg-white border-slate-300 hover:border-indigo-400 hover:bg-indigo-50 cursor-pointer text-slate-400'
            }`}>
            {isUp ? card.text : '?'}
        </button>
        );
        })}
    </div>
    {allDone && (
    <div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">
        <p className="text-emerald-800 font-bold text-lg">🎉 ¡Completaste el desafío en {moves} intentos!</p>
        <button onClick={onReset}
            className="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Jugar de nuevo</button>
    </div>
    )}
    {!allDone && <p className="text-sm text-slate-500 text-center">Intentos: {moves} — Pares encontrados:
        {matched.length / 2} de {data.pairs.length}</p>}
</div>
);
};

const SequenceGame = ({ data, onReset }) => {
const [qi, setQi] = useState(0);
const [score, setScore] = useState(0);
const [picked, setPicked] = useState(null);
const [showHint, setShowHint] = useState(false);
const q = data.questions[qi];
const done = qi >= data.questions.length;

const pick = (i) => {
if (picked !== null) return;
setPicked(i);
if (i === q.correct) setScore(s => s + 1);
};
const next = () => { setPicked(null); setShowHint(false); setQi(i => i + 1); };

if (done) return (
<div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">
    <p className="text-emerald-800 font-bold text-lg">🎉 Completaste {score} de {data.questions.length}</p>
    <button onClick={onReset}
        className="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Reiniciar</button>
</div>
);

return (
<div>
    <p className="text-sm text-slate-500 mb-3">Pregunta {qi + 1} de {data.questions.length}</p>
    <div className="flex items-center gap-2 mb-4 flex-wrap">
        {q.sequence.map((s, i) => (
        <span key={i} className={`px-4 py-2 rounded-lg font-bold text-lg ${s==='?'
            ? 'bg-amber-100 border-2 border-amber-400 text-amber-700' : 'bg-slate-100 border border-slate-300'
            }`}>{s}</span>
        ))}
    </div>
    <div className="grid grid-cols-2 gap-3 mb-4">
        {q.options.map((opt, i) => (
        <button key={i} onClick={()=> pick(i)} className={`p-3 rounded-xl border-2 font-medium transition-all ${
            picked === null ? 'bg-white border-slate-300 hover:border-indigo-400 cursor-pointer' :
            i === q.correct ? 'bg-emerald-100 border-emerald-400 text-emerald-800' :
            i === picked ? 'bg-rose-100 border-rose-400 text-rose-800' :
            'bg-slate-50 border-slate-200 text-slate-400'
            }`}>{opt}</button>
        ))}
    </div>
    {picked !== null && picked !== q.correct && <p className="text-rose-700 mb-2">Esa no es — intentá otra vez o mirá la
        pista.</p>}
    {picked === q.correct && <p className="text-emerald-700 mb-2 font-medium">¡Correcto! {q.hint}</p>}
    {!showHint && picked !== q.correct && <button onClick={()=> setShowHint(true)} className="text-sm text-indigo-600
        underline mb-2">Ver pista</button>}
    {showHint && <p className="text-sm text-indigo-700 italic mb-2">💡 {q.hint}</p>}
    {picked !== null && <button onClick={next}
        className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Siguiente →</button>}
</div>
);
};

const OrderStepsGame = ({ data, onReset }) => {
const [ei, setEi] = useState(0);
const [selected, setSelected] = useState([]);
const [shuffled] = useState(() => data.exercises.map(ex => [...ex.steps].sort(() => Math.random() - 0.5)));
const ex = data.exercises[ei];
const done = ei >= data.exercises.length;
const available = shuffled[ei] ? shuffled[ei].filter(s => !selected.includes(s)) : [];
const isCorrect = selected.length === ex?.steps.length && selected.every((s, i) => s === ex.steps[i]);
const isWrong = selected.length > 0 && selected.length === ex?.steps.length && !isCorrect;

const addStep = (step) => { setSelected(p => [...p, step]); };
const reset = () => { setSelected([]); };
const next = () => { setSelected([]); setEi(i => i + 1); };

if (done) return (
<div className="text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">
    <p className="text-emerald-800 font-bold text-lg">🎉 ¡Completaste todos los ejercicios de orden!</p>

</div>
);

return (

            <span className="font-bold mr-2">{i + 1}.</span>{s}

        ))}
    </div>
    )}
    {!isCorrect && !isWrong && available.length > 0 && (
    <div className="space-y-2 mb-4">
        <p className="text-xs font-bold text-slate-500">Tocá el siguiente paso:</p>
        {available.map((s, i) => (
        <button key={i} onClick={()=> addStep(s)} className="w-full text-left p-3 rounded-xl border-2 bg-white
            border-slate-300 hover:border-indigo-400 hover:bg-indigo-50 transition-all">{s}</button>
        ))}
    </div>
    )}
    {isCorrect && <p className="text-emerald-700 font-medium mb-3">¡Perfecto! El orden es correcto.</p>}
    {isWrong && <p className="text-rose-700 mb-3">No exactamente. Intentalo de nuevo.</p>}
    <div className="flex gap-2">
        {(isWrong || selected.length > 0) && !isCorrect && <button onClick={reset}

        {isCorrect && <button onClick={next}
            className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Siguiente →</button>}
    </div>
</div>
);
};

const AssociationGame = ({ data, onReset }) => {
const [selectedLeft, setSelectedLeft] = useState(null);
const [matched, setMatched] = useState({});
const [wrong, setWrong] = useState(null);
const shuffledRight = useMemo(() => [...data.pairs.map(p => p[1])].sort(() => Math.random() - 0.5), []);
const allDone = Object.keys(matched).length === data.pairs.length;

const clickLeft = (concept) => { if (matched[concept]) return; setSelectedLeft(concept); setWrong(null); };
const clickRight = (def) => {
if (!selectedLeft || Object.values(matched).includes(def)) return;
const pair = data.pairs.find(p => p[0] === selectedLeft && p[1] === def);
if (pair) { setMatched(p => ({...p, [selectedLeft]: def})); setSelectedLeft(null); }
else { setWrong(def); setTimeout(() => setWrong(null), 800); }
};

return (
<div>
    <div className="grid grid-cols-2 gap-4">
        <div className="space-y-2">
            <p className="text-xs font-bold text-slate-500 mb-1">Conceptos</p>
            {data.pairs.map(([concept], i) => (
            <button key={i} onClick={()=> clickLeft(concept)} className={`w-full text-left p-3 rounded-xl border-2
                transition-all text-sm ${
                matched[concept] ? 'bg-emerald-100 border-emerald-300 text-emerald-700' :
                selectedLeft === concept ? 'bg-indigo-100 border-indigo-400 text-indigo-800 ring-2 ring-indigo-300' :
                'bg-white border-slate-300 hover:border-indigo-400 cursor-pointer'
                }`}>{concept}</button>
            ))}
        </div>
        <div className="space-y-2">
            <p className="text-xs font-bold text-slate-500 mb-1">Definiciones</p>
            {shuffledRight.map((def, i) => (
            <button key={i} onClick={()=> clickRight(def)} className={`w-full text-left p-3 rounded-xl border-2
                transition-all text-sm ${
                Object.values(matched).includes(def) ? 'bg-emerald-100 border-emerald-300 text-emerald-700' :
                wrong === def ? 'bg-rose-100 border-rose-400' :
                'bg-white border-slate-300 hover:border-indigo-400 cursor-pointer'
                }`}>{def}</button>
            ))}
        </div>
    </div>
    {allDone && (
    <div className="mt-4 text-center p-4 bg-emerald-50 rounded-xl border border-emerald-200">
        <p className="text-emerald-800 font-bold text-lg">🎉 ¡Todas las asociaciones correctas!</p>
        <button onClick={onReset}
            className="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Jugar de nuevo</button>
    </div>
    )}
    {!allDone && <p className="text-sm text-slate-500 mt-3 text-center">Asociaciones: {Object.keys(matched).length} de
        {data.pairs.length}</p>}
</div>
);
};

    </p>}
    {picked !== null && picked !== g.intruder && <p className="text-rose-700 mb-2">No es ese. El intruso era:

    {picked !== null && <button onClick={next}

</div>
);
};

const ChallengesSection = () => {

const props = { data: challenge, onReset: doReset, key: resetKey };
switch (challenge.type) {
case 'memoryPairs': return <MemoryPairsGame {...props} />;
case 'sequence': return <SequenceGame {...props} />;
case 'spotDifference': return <SpotDifferenceGame {...props} />;
case 'orderSteps': return <OrderStepsGame {...props} />;
case 'association': return <AssociationGame {...props} />;
case 'intruder': return <IntruderGame {...props} />;
default: return null;
}
};

if (activeChallenge && challenge) {
return (
<div className="max-w-3xl mx-auto">

return (

            <p className="text-sm text-slate-600">{ch.description}</p>

            <div key={i} className={`p-4 rounded-xl border-2 ${roleColor[msg.role] || 'bg-white border-slate-200' }`}>
                <p className="text-xs font-bold uppercase mb-1 opacity-70">{roleLabel[msg.role] || msg.role}</p>
                <p>{msg.text}</p>
            </div>
            ))}
        </div>
        {step < story.conversation.length - 1 ? ( <button onClick={()=> setStep(s => s + 1)} className="px-6 py-3
            bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all font-medium">
            Siguiente paso →
            </button>
            ) : (
            <div className="bg-sky-50 rounded-xl p-5 border border-sky-200">
                <p className="font-bold text-sky-800 mb-2">📋 Prompt reutilizable</p>
                <p className="text-sky-900 italic mb-3">"{story.reusablePrompt}"</p>
                <button onClick={copyPrompt}
                    className="flex items-center gap-2 px-4 py-2 bg-sky-600 text-white rounded-lg hover:bg-sky-700">
                    {copied ? <>
                        <Check className="w-4 h-4" /> Copiado
                    </> : <>
                        <Copy className="w-4 h-4" /> Copiar prompt
                    </>}
                </button>
            </div>
            )}
    </div>
</div>
);
};
